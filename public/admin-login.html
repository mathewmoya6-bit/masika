<script>
// ============================================================
// MASIKA BENEVOLENT — ADMIN LOGIN
// ============================================================

const alertBox = document.getElementById('alertBox');
const loginBtn = document.getElementById('loginBtn');
const loginForm = document.getElementById('loginForm');

// ------------------------------------------------------------
// Alert utilities
// ------------------------------------------------------------
function showAlert(message, type = 'error') {
    alertBox.textContent = message;
    alertBox.className = `alert show ${type}`;
}

function clearAlert() {
    alertBox.className = 'alert';
}

function setInputError(inputId, hasError) {
    const input = document.getElementById(inputId);
    if (input) {
        input.classList.toggle('error', hasError);
    }
}

// ------------------------------------------------------------
// Login handler
// ------------------------------------------------------------
async function handleLogin(event) {
    event.preventDefault();
    clearAlert();
    
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    
    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;

    // Validate inputs
    setInputError('email', false);
    setInputError('password', false);

    if (!email) {
        showAlert('Please enter your email address.');
        setInputError('email', true);
        emailInput.focus();
        return;
    }

    if (!password) {
        showAlert('Please enter your password.');
        setInputError('password', true);
        passwordInput.focus();
        return;
    }

    if (password.length < 8) {
        showAlert('Password must be at least 8 characters.');
        setInputError('password', true);
        passwordInput.focus();
        return;
    }

    // Show loading state
    loginBtn.classList.add('loading');
    loginBtn.disabled = true;

    try {
        // 1. Authenticate with Supabase
        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

        if (error) {
            console.error('Supabase login error:', error);
            showAlert(error.message || 'Invalid email or password.');
            setInputError('email', true);
            setInputError('password', true);
            return;
        }

        if (!data?.user) {
            showAlert('Login failed. No user session was created.');
            return;
        }

        console.log('Authentication successful:', data.user.id);

        // 2. Verify staff record
        const { data: staff, error: staffError } = await supabaseClient
            .from('staff')
            .select('id, auth_user_id, employee_number, full_name, role_id')
            .eq('auth_user_id', data.user.id)
            .maybeSingle();

        if (staffError) {
            console.error('Staff lookup error:', staffError);
            await supabaseClient.auth.signOut();
            showAlert('Could not verify your staff account. Please contact support.');
            return;
        }

        if (!staff) {
            console.error('No staff record for:', data.user.id);
            await supabaseClient.auth.signOut();
            showAlert('Access denied. Your account is not registered as staff.');
            return;
        }

        console.log('Staff record found:', staff);

        // 3. Verify role
        const { data: role, error: roleError } = await supabaseClient
            .from('roles')
            .select('id, role_code, role_name, is_active')
            .eq('id', staff.role_id)
            .maybeSingle();

        if (roleError || !role) {
            console.error('Role lookup error:', roleError);
            await supabaseClient.auth.signOut();
            showAlert('Could not verify your staff role. Please contact support.');
            return;
        }

        console.log('Role found:', role);

        // 4. Validate role
        const roleCode = String(role.role_code || '').trim().toUpperCase();
        const allowedRoles = ['SUPER_ADMIN', 'BRANCH_MANAGER', 'SALES_AGENT', 'AUDITOR'];

        if (role.is_active !== true) {
            await supabaseClient.auth.signOut();
            showAlert('Access denied. Your staff role is inactive.');
            return;
        }

        if (!allowedRoles.includes(roleCode)) {
            console.error('Unauthorized role:', roleCode);
            await supabaseClient.auth.signOut();
            showAlert('Access denied. Your role does not have system access.');
            return;
        }

        // 5. Store session
        const sessionData = {
            adminLoggedIn: 'true',
            adminId: staff.id,
            adminAuthUserId: data.user.id,
            adminRole: roleCode,
            adminName: staff.full_name || data.user.email,
            adminEmployeeNumber: staff.employee_number || '',
            adminProfile: JSON.stringify({
                id: staff.id,
                auth_user_id: staff.auth_user_id,
                employee_number: staff.employee_number,
                full_name: staff.full_name,
                email: data.user.email,
                role: roleCode,
                role_name: role.role_name
            })
        };

        Object.entries(sessionData).forEach(([key, value]) => {
            sessionStorage.setItem(key, value);
        });

        // 6. Show success message
        const displayName = staff.full_name || 'Admin';
        showAlert(`Welcome ${displayName}! Redirecting...`, 'success');

        // 7. Redirect
        setTimeout(() => {
            window.location.href = 'admin-dashboard.html';
        }, 500);

    } catch (error) {
        console.error('Unexpected login error:', error);
        showAlert('An unexpected error occurred. Please try again.');
    } finally {
        loginBtn.classList.remove('loading');
        loginBtn.disabled = false;
    }
}

// ------------------------------------------------------------
// Check existing session
// ------------------------------------------------------------
async function checkExistingSession() {
    try {
        // Check session storage first
        const loggedIn = sessionStorage.getItem('adminLoggedIn');
        if (loggedIn === 'true') {
            const profile = sessionStorage.getItem('adminProfile');
            if (profile) {
                window.location.href = 'admin-dashboard.html';
                return;
            }
        }

        // Check Supabase session
        const { data } = await supabaseClient.auth.getSession();
        if (!data?.session) return;

        const userId = data.session.user.id;

        // Verify staff record
        const { data: staff } = await supabaseClient
            .from('staff')
            .select('id, auth_user_id, employee_number, full_name, role_id')
            .eq('auth_user_id', userId)
            .maybeSingle();

        if (!staff) return;

        // Verify role
        const { data: role } = await supabaseClient
            .from('roles')
            .select('id, role_code, role_name, is_active')
            .eq('id', staff.role_id)
            .maybeSingle();

        const roleCode = String(role?.role_code || '').trim().toUpperCase();
        const allowedRoles = ['SUPER_ADMIN', 'BRANCH_MANAGER', 'SALES_AGENT', 'AUDITOR'];

        if (role?.is_active === true && allowedRoles.includes(roleCode)) {
            // Rebuild session
            const sessionData = {
                adminLoggedIn: 'true',
                adminId: staff.id,
                adminAuthUserId: userId,
                adminRole: roleCode,
                adminName: staff.full_name || data.session.user.email,
                adminEmployeeNumber: staff.employee_number || '',
                adminProfile: JSON.stringify({
                    id: staff.id,
                    auth_user_id: staff.auth_user_id,
                    employee_number: staff.employee_number,
                    full_name: staff.full_name,
                    email: data.session.user.email,
                    role: roleCode,
                    role_name: role.role_name
                })
            };

            Object.entries(sessionData).forEach(([key, value]) => {
                sessionStorage.setItem(key, value);
            });

            window.location.href = 'admin-dashboard.html';
        }
    } catch (error) {
        console.warn('Session check failed:', error);
    }
}

// ------------------------------------------------------------
// Initialize
// ------------------------------------------------------------
document.addEventListener('DOMContentLoaded', checkExistingSession);

// Attach login handler to form
document.getElementById('loginForm').addEventListener('submit', handleLogin);
</script>
