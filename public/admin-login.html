<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Masika Benevolent</title>
    <link rel="icon" type="image/png" href="../assets/favicon-32x32.png">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0b5d3b;
            --primary-dark: #06452c;
            --primary-light: #e8f5ee;
            --gold: #d4a843;
            --danger: #dc3545;
            --text: #1f2933;
            --text-light: #6b7280;
            --white: #ffffff;
            --shadow: 0 4px 24px rgba(0,0,0,0.1);
            --radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f4f2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: var(--white);
            border-radius: var(--radius);
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--shadow);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header .logo {
            width: 64px;
            height: 64px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
            font-weight: 900;
            color: white;
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
        }

        .login-header p {
            color: var(--text-light);
            font-size: 14px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--text);
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(11,93,59,0.1);
        }

        .form-group input.error {
            border-color: var(--danger);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(11,93,59,0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            display: none;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .alert.show {
            display: block;
        }

        .alert.error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }

        .alert.success {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-light);
        }

        .login-footer a {
            color: var(--primary);
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .btn.loading .spinner {
            display: inline-block;
        }

        .btn.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <div class="logo">MB</div>
            <h1>Admin Login</h1>
            <p>Masika Benevolent Management System</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="admin@masikabbs.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required minlength="8">
            </div>

            <button type="submit" class="btn btn-primary" id="loginBtn">
                <span class="btn-text">Sign In</span>
                <span class="spinner"></span>
            </button>
        </form>

        <div class="login-footer">
            <a href="../index.html">← Back to Home</a>
        </div>
    </div>

    <script src="../js/supabase-config.js"></script>
    <script>
        // ============================================================
        // ADMIN LOGIN
        // ============================================================

        const alertBox = document.getElementById('alertBox');
        const loginBtn = document.getElementById('loginBtn');

        function showAlert(message, type = 'error') {
            alertBox.textContent = message;
            alertBox.className = `alert show ${type}`;
        }

        function clearAlert() {
            alertBox.className = 'alert';
        }

        async function handleLogin(event) {
            event.preventDefault();
            clearAlert();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showAlert('Please enter your email and password.', 'error');
                return;
            }

            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            try {
                // Sign in with Supabase
                const { data, error } = await window.supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    showAlert('Invalid email or password.', 'error');
                    return;
                }

                // Check if user is admin
                const { data: admin, error: adminError } = await window.supabaseClient
                    .from('admin_profiles')
                    .select('*')
                    .eq('user_id', data.user.id)
                    .eq('is_active', true)
                    .maybeSingle();

                if (adminError || !admin) {
                    await window.supabaseClient.auth.signOut();
                    showAlert('Access denied. You are not authorized as admin.', 'error');
                    return;
                }

                // Check admin role
                const allowedRoles = ['super_admin', 'admin', 'manager'];
                if (!allowedRoles.includes(admin.role?.toLowerCase())) {
                    await window.supabaseClient.auth.signOut();
                    showAlert('Access denied. Insufficient permissions.', 'error');
                    return;
                }

                // Store admin session
                sessionStorage.setItem('adminLoggedIn', 'true');
                sessionStorage.setItem('adminRole', admin.role);
                sessionStorage.setItem('adminId', admin.id);
                sessionStorage.setItem('adminName', admin.full_name || 'Admin');

                // Redirect to dashboard
                window.location.href = 'admin-dashboard.html';

            } catch (error) {
                console.error('Login error:', error);
                showAlert('An error occurred. Please try again.', 'error');
            } finally {
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        }

        // Check if already logged in
        document.addEventListener('DOMContentLoaded', async function() {
            const loggedIn = sessionStorage.getItem('adminLoggedIn');
            if (loggedIn === 'true') {
                window.location.href = 'admin-dashboard.html';
            }
        });
    </script>

</body>
</html>
