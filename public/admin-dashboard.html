        // ============================================================

        document.addEventListener('DOMContentLoaded', async function() {

        // ============================================================
        // AUTH CHECK
        // ============================================================
        async function checkAuth() {
            console.log('🔐 Checking authentication...');
            
            try {
                const { data: { session }, error } = await masikaSupabase.auth.getSession();

                if (error) {
                    console.error('❌ Session error:', error);
                    window.location.href = 'admin-login.html';
                    return false;
                }

                if (!session) {
                    console.log('⚠️ No session found');
                    window.location.href = 'admin-login.html';
                    return false;
                }

                console.log('✅ User authenticated:', session.user.email);

                const { data: admin, error: adminError } = await masikaSupabase
                    .from('admins')
                    .select('*')
                    .eq('id', session.user.id)
                    .single();

                if (adminError) {
                    console.error('❌ Admin check error:', adminError);
                    window.location.href = 'admin-login.html';
                    return false;
                }

                if (!admin) {
                    console.log('⚠️ Not an admin user');
                    window.location.href = 'admin-login.html';

                }

                console.log('✅ Admin verified:', admin.full_name);

                // Update UI
                document.getElementById('adminName').textContent = admin.full_name || 'Admin';
                document.getElementById('adminRole').textContent = admin.role || 'Administrator';
                document.getElementById('welcomeName').textContent = admin.full_name || 'Admin';
                document.getElementById('adminAvatar').textContent = (admin.full_name || 'A').charAt(0).toUpperCase();

                document.getElementById('liveIndicator').classList.add('connected');
                document.getElementById('liveIndicatorLabel').textContent = 'Connected';

                return true;

            } catch (error) {
                console.error('❌ Auth check error:', error);
                showToast('error', 'Authentication error');
                return false;
            }
        }

        // ============================================================
        // HELPER FUNCTIONS
        // ============================================================
        function formatKES(amount) {
            return `KES ${Number(amount || 0).toLocaleString()}`;
        }

        function formatDate(value) {
            if (!value) return '—';
            try {
                return new Date(value).toLocaleDateString('en-KE', {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric'
                });
            } catch {
                return '—';
            }
        }

        function escapeHtml(value) {
            if (!value) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function setLiveStatus(status) {
            const indicator = document.getElementById('liveIndicator');
            const label = document.getElementById('liveIndicatorLabel');
            
            if (indicator) {
                indicator.className = 'live-indicator';
                if (status === 'Live' || status === 'Connected') {
                    indicator.classList.add('connected');
                } else if (status === 'Error') {
                    indicator.classList.add('error');
                }
            }
            if (label) {
                label.textContent = status;
            }
        }

        // ============================================================
        // LOAD DASHBOARD DATA
        // ============================================================
        async function loadDashboardData() {
            try {
                setLiveStatus('Loading...');
                console.log('🔄 Loading dashboard data...');

                // ============================================
                // 1. MEMBERS COUNT
                // ============================================
                const { count: membersCount, error: membersError } = await masikaSupabase
                    .from('members')
                    .select('*', { count: 'exact', head: true });

                if (membersError) {
                    console.error('❌ Members error:', membersError);
                }
                const totalMembers = membersCount || 0;
                console.log('✅ Members:', totalMembers);

                // ============================================
                // 2. AGENTS COUNT
                // ============================================
                const { count: agentsCount, error: agentsError } = await masikaSupabase
                    .from('sales_agents')
                    .select('*', { count: 'exact', head: true });

                if (agentsError) {
                    console.error('❌ Agents error:', agentsError);
                }
                const totalAgents = agentsCount || 0;
                console.log('✅ Total Agents:', totalAgents);

                // ============================================
                // 3. ACTIVE AGENTS
                // ============================================
                const { count: activeAgentsCount, error: activeError } = await masikaSupabase
                    .from('sales_agents')
                    .select('*', { count: 'exact', head: true })
                    .ilike('status', 'active');

                if (activeError) {
                    console.error('❌ Active agents error:', activeError);
                }
                const activeAgents = activeAgentsCount || 0;
                console.log('✅ Active Agents:', activeAgents);

                // ============================================
                // 4. PAYMENTS
                // ============================================
                const { data: allPayments, error: paymentsError } = await masikaSupabase
                    .from('payments')
                    .select('*');

                if (paymentsError) {
                    console.error('❌ Payments error:', paymentsError);
                }
                const payments = allPayments || [];
                console.log('✅ Total payments:', payments.length);

                // ============================================
                // 5. UPDATE STATS
                // ============================================
                document.getElementById('totalMembers').textContent = totalMembers.toLocaleString();
                document.getElementById('totalAgents').textContent = totalAgents.toLocaleString();
                document.getElementById('activeAgents').textContent = activeAgents.toLocaleString();
                document.getElementById('memberCountBadge').textContent = totalMembers;
                document.getElementById('pendingAgentsBadge').textContent = (totalAgents - activeAgents) || 0;

                // ============================================
                // 6. REVENUE CALCULATIONS
                // ============================================
                const completedPayments = payments.filter(p => 
                    p.payment_status === 'SUCCESSFUL' || 
                    p.status === 'completed' || 
                    p.status === 'confirmed'
                );
                const totalRevenue = completedPayments.reduce((sum, p) => sum + (p.amount || 0), 0);

                // Today
                const today = new Date().toDateString();
                const todayPayments = completedPayments.filter(p => 
                    p.created_at && new Date(p.created_at).toDateString() === today
                );
                const todayRevenue = todayPayments.reduce((sum, p) => sum + (p.amount || 0), 0);

                // This month
                const now = new Date();
                const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
                const monthPayments = completedPayments.filter(p => 
                    p.created_at && new Date(p.created_at) >= monthStart
                );
                const monthRevenue = monthPayments.reduce((sum, p) => sum + (p.amount || 0), 0);

                // Unassigned (SUCCESSFUL payments with no member_id)
                const unassignedPayments = payments.filter(p => 
                    (p.payment_status === 'SUCCESSFUL' || p.status === 'completed') && 
                    !p.member_id
                );
                const unassignedTotal = unassignedPayments.reduce((sum, p) => sum + (p.amount || 0), 0);

                // Pending
                const pendingPayments = payments.filter(p => 
                    p.payment_status === 'PENDING' || p.status === 'pending'
                );
                const pendingTotal = pendingPayments.reduce((sum, p) => sum + (p.amount || 0), 0);

                console.log('💰 Revenue - Today:', todayRevenue, 'Month:', monthRevenue, 'Total:', totalRevenue);
                console.log('📋 Unassigned:', unassignedPayments.length, 'Pending:', pendingPayments.length);

                // ============================================
                // 7. UPDATE REVENUE STATS
                // ============================================
                document.getElementById('totalRevenue').textContent = formatKES(totalRevenue);
                document.getElementById('totalRevenueCount').textContent = `${completedPayments.length} payments`;

                document.getElementById('dailyRevenue').textContent = formatKES(todayRevenue);
                document.getElementById('dailyRevenueCount').textContent = `${todayPayments.length} payments`;

                document.getElementById('monthRevenue').textContent = formatKES(monthRevenue);
                document.getElementById('monthRevenueCount').textContent = `${monthPayments.length} payments`;

                document.getElementById('unassignedCount').textContent = unassignedPayments.length.toLocaleString();
                document.getElementById('unassignedAmount').textContent = formatKES(unassignedTotal);
                document.getElementById('unassignedBadge').textContent = unassignedPayments.length;

                document.getElementById('pendingPayments').textContent = pendingPayments.length.toLocaleString();
                document.getElementById('pendingAmount').textContent = formatKES(pendingTotal);

                // ============================================
                // 8. LOAD RECENT DATA
                // ============================================
                await Promise.all([
                    loadRecentMembers(),
                    loadRecentAgents(),
                    loadRecentPayments(),
                    loadUnassignedPayments()
                ]);

                setLiveStatus('Live');
                console.log('✅ Dashboard loaded successfully!');

            } catch (error) {
                console.error('❌ Dashboard error:', error);
                setLiveStatus('Error');
                showToast('error', 'Failed to load dashboard data: ' + error.message);
            }
        }

        // ============================================================
        // LOAD RECENT MEMBERS
        // ============================================================
        async function loadRecentMembers() {
            console.log('📋 Loading recent members...');
            
            try {
                const { data, error } = await masikaSupabase
                    .from('members')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(5);

                if (error) {
                    console.error('❌ Recent members error:', error);
                    return;
                }

                console.log('📋 Recent members:', data?.length || 0);

                const tbody = document.getElementById('recentMembersBody');

                if (!data || data.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="4" class="empty-state">
                                <i class="fas fa-users"></i>
                                No members registered yet
                            </td>
                        </tr>
                    `;
                    return;
                }

                tbody.innerHTML = data.map(m => `
                    <tr onclick="window.location.href='admin-members.html?id=${m.id}'" style="cursor:pointer;">
                        <td><strong>${escapeHtml(m.first_name || '')} ${escapeHtml(m.last_name || '')}</strong></td>
                        <td>${escapeHtml(m.phone || 'N/A')}</td>
                        <td>${m.created_at ? new Date(m.created_at).toLocaleDateString('en-KE') : 'N/A'}</td>
                        <td><span class="status-badge ${m.is_active ? 'active' : 'inactive'}">${m.is_active ? 'Active' : 'Inactive'}</span></td>
                    </tr>
                `).join('');

            } catch (error) {
                console.error('❌ Load recent members error:', error);
            }
        }

        // ============================================================
        // LOAD RECENT PAYMENTS
        // ============================================================
        async function loadRecentPayments() {
            console.log('📋 Loading recent payments...');
            
            try {
                const { data, error } = await masikaSupabase
                    .from('payments')
                    .select(`
                        id,
                        member_id,
                        membership_id,
                        amount,
                        expected_amount,
                        payment_method,
                        payment_status,
                        payment_date,
                        phone_number,
                        phone,
                        mpesa_receipt,
                        mpesa_receipt_number,
                        transaction_reference,
                        account_number,
                        account_reference,
                        status,
                        reference,
                        created_at
                    `)
                    .order('created_at', { ascending: false })
                    .limit(10);

                if (error) {
                    console.error('❌ Recent payments error:', error);
                    return;
                }

                const container = document.getElementById('recentPayments');

                if (!container) {
                    console.warn('⚠️ recentPayments container not found');
                    return;

                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-credit-card"></i>
                            <p>No payments recorded yet</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Account / Reference</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.map(payment => {
                                    const paymentStatus = String(payment.payment_status || payment.status || '').toUpperCase();
                                    let badgeClass = 'pending';
                                    
                                    if (paymentStatus === 'SUCCESSFUL' || paymentStatus === 'COMPLETED' || paymentStatus === 'CONFIRMED') {
                                        badgeClass = 'successful';
                                    } else if (paymentStatus === 'FAILED') {
                                        badgeClass = 'failed';
                                    }

                                    const receipt = payment.mpesa_receipt_number || payment.mpesa_receipt || payment.transaction_reference || payment.reference || '—';
                                    const phone = payment.phone_number || payment.phone || '—';
                                    const account = payment.account_number || payment.account_reference || 'Payment';

                                    return `
                                        <tr>
                                            <td>
                                                <strong>${escapeHtml(account)}</strong>
                                                <small style="display:block;font-size:12px;color:var(--text-light);">${escapeHtml(phone)}</small>

                                                <strong>${formatKES(payment.amount)}</strong>

                                            <td>

        // ============================================================
        // LOAD UNASSIGNED PAYMENTS

                        </div>
                    `;
                    return;
                }

                container.innerHTML = `
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Amount</th>
                                    <th>Reference / Account</th>

                                </tr>
                            </thead>

                                    const account = payment.account_number || payment.account_reference || 'No account';

                                    return `
                                        <tr>
                                            <td><strong>${formatKES(payment.amount)}</strong></td>
                                            <td>
                                                ${escapeHtml(receipt)}
                                                <small style="display:block;font-size:12px;color:var(--text-light);">${escapeHtml(account)}</small>

                                            <td>${formatDate(payment.payment_date || payment.created_at)}</td>
                                            <td>
                                                <button onclick="assignPayment('${payment.id}')" class="btn btn-primary btn-sm">
                                                    <i class="fas fa-link"></i> Assign

            } catch (error) {
                console.error('❌ Load unassigned payments error:', error);
                document.getElementById('unassignedPaymentsList').innerHTML = `
                    <div class="error-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Failed to load unassigned payments</p>

                `;

        // ============================================================
        // ASSIGN PAYMENT
        // ============================================================
        window.assignPayment = async function(paymentId) {
            if (!paymentId) {
                showToast('Payment ID is required.', 'error');
                return;
            }

            const memberNumber = prompt('Enter member number to assign this payment to:');
            if (!memberNumber) return;

            try {
                const { data: member, error: memberError } = await masikaSupabase
                    .from('members')
                    .select('id, membership_number, first_name, last_name')
                    .eq('membership_number', memberNumber)
                    .single();

                if (memberError || !member) {
                    showToast('Member not found. Please check the membership number.', 'error');
                    return;
                }

                const { data, error: updateError } = await masikaSupabase
                    .from('payments')
                    .update({
                        member_id: member.id,
                        membership_id: member.id,
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', paymentId)
                    .select()
                    .single();

                if (updateError) {
                    console.error('Assign payment error:', updateError);
                    showToast(`Unable to assign payment: ${updateError.message}`, 'error');
                    return;
                }

                console.log('✅ Payment assigned:', data);
                showToast(`Payment assigned to ${member.membership_number} successfully.`, 'success');
                await loadDashboardData();

            } catch (error) {
                console.error('❌ Assign payment error:', error);
                showToast('Failed to assign payment: ' + error.message, 'error');
            }
        };

        // ============================================================
        // REFRESH DATA
        // ============================================================
        window.refreshData = async function() {
            const icon = document.getElementById('refreshIcon');
            const btn = document.getElementById('refreshBtn');

            if (icon) icon.classList.add('spinning');
            if (btn) btn.disabled = true;

            try {
                await loadDashboardData();
                showToast('success', 'Dashboard refreshed successfully');
            } catch (error) {
                showToast('error', 'Failed to refresh data');
            } finally {
                if (icon) icon.classList.remove('spinning');
                if (btn) btn.disabled = false;
            }
        };

        // ============================================================
        // REAL-TIME SUBSCRIPTIONS
        // ============================================================
        function setupRealtime() {
            console.log('🔌 Setting up real-time subscriptions...');
            
            const channel = masikaSupabase.channel('dashboard-changes')
                .on(
                    'postgres_changes',
                    { event: '*', schema: 'public', table: 'payments' },
                    () => debounceRefresh()
                )
                .on(
                    'postgres_changes',
                    { event: '*', schema: 'public', table: 'members' },
                    () => debounceRefresh()
                )
                .on(
                    'postgres_changes',
                    { event: '*', schema: 'public', table: 'sales_agents' },
                    () => debounceRefresh()
                )
                .subscribe((status) => {
                    console.log('🔌 Subscription status:', status);
                    if (status === 'SUBSCRIBED') {
                        document.getElementById('liveIndicator').classList.add('connected');
                        document.getElementById('liveIndicatorLabel').textContent = 'Live';
                    }
                });
        }

        function debounceRefresh() {
            clearTimeout(refreshTimeout);
            refreshTimeout = setTimeout(() => {
                loadDashboardData();
            }, 1000);
        }

        function setupAutoRefresh() {
            console.log('⏰ Setting up auto-refresh (60s)');
            setInterval(() => {
                loadDashboardData();
            }, 60000);
        }

        // ============================================================
        // TOAST NOTIFICATIONS
        // ============================================================
        function showToast(type, message) {
            const container = document.getElementById('toastContainer');

            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-triangle-exclamation',
                info: 'fa-info-circle'
            };

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas ${icons[type] || icons.info}"></i>
                <span>${message}</span>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100px)';
                toast.style.transition = 'all 0.4s ease';
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        // ============================================================
        // LOGOUT
        // ============================================================
        window.handleLogout = async function() {
            try {
                await masikaSupabase.auth.signOut();
                sessionStorage.clear();
                window.location.href = 'admin-login.html';
            } catch (error) {
                console.error('Logout error:', error);
                showToast('error', 'Failed to logout');
            }
        };

        // ============================================================
        // SHELL BEHAVIOR
        // ============================================================
        (function() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            const toggleBtn = document.getElementById('sidebarToggle');
            const clockEl = document.getElementById('currentDateTime');

            function openSidebar() {
                sidebar.classList.add('open');
                backdrop.classList.add('show');
            }

            function closeSidebar() {
                sidebar.classList.remove('open');
                backdrop.classList.remove('show');
            }

            if (toggleBtn) {
                toggleBtn.addEventListener('click', function() {
                    if (sidebar.classList.contains('open')) {
                        closeSidebar();
                    } else {
                        openSidebar();
                    }
                });
            }

            if (backdrop) {
                backdrop.addEventListener('click', closeSidebar);
            }

            document.querySelectorAll('.sidebar-nav a').forEach(function(link) {
                link.addEventListener('click', closeSidebar);
            });

            function updateClock() {
                if (!clockEl) return;
                const now = new Date();
                clockEl.textContent = now.toLocaleString('en-KE', {
                    weekday: 'short',
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }
            updateClock();
            setInterval(updateClock, 30000);
        })();

        // ============================================================
        // EXPOSE FUNCTIONS
        // ============================================================
        window.refreshData = refreshData;
        window.handleLogout = handleLogout;
        window.showToast = showToast;
        window.assignPayment = assignPayment;
        window.loadDashboardData = loadDashboardData;
        window.formatKES = formatKES;
        window.formatDate = formatDate;
        
        console.log('✅ All functions registered');
        console.log('📌 Open browser console to see debug output');
    </script>

</body>
</html>
