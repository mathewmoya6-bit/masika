<svg width="680" height="270" viewBox="0 0 680 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logoTitle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="logoTitle">Masika Benevolent — Funeral, Burial &amp; Benevolent Services</title>

  <defs>
    <linearGradient id="birdLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#63b6ea"/>
      <stop offset="55%" stop-color="#2f8fd6"/>
      <stop offset="100%" stop-color="#1568b5"/>
    </linearGradient>
    <linearGradient id="birdDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#154a91"/>
      <stop offset="100%" stop-color="#0a2a5e"/>
    </linearGradient>
    <linearGradient id="wordmarkBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f7fd6"/>
      <stop offset="100%" stop-color="#0f5fb0"/>
    </linearGradient>
  </defs>

  <!-- ============ BIRD MARK ============ -->
  <g id="birdMark" transform="translate(0,10) scale(0.86)">
    <!-- lower / tail feathers (dark) -->
    <path d="M18,150
             C70,120 130,118 175,140
             C150,152 118,158 88,160
             C122,166 158,164 190,150
             C165,172 118,182 60,176
             C40,174 24,166 18,150 Z"
          fill="url(#birdDark)"/>

    <!-- body sweep connecting wing to tail -->
    <path d="M40,140
             C95,96 150,70 205,62
             C230,58 252,60 268,70
             C246,72 224,80 205,94
             C170,120 150,148 118,158
             C88,166 55,160 40,140 Z"
          fill="url(#birdDark)" opacity="0.92"/>

    <!-- upper wing (light, main sweep) -->
    <path d="M20,118
             C68,50 132,10 205,6
             C240,4 268,14 282,34
             C258,26 226,28 196,42
             C232,36 264,44 282,66
             C254,58 222,60 195,74
             C226,70 254,80 268,100
             C238,94 206,92 178,102
             C130,120 84,132 20,118 Z"
          fill="url(#birdLight)"/>

    <!-- head / beak accent -->
    <path d="M260,62
             C272,56 284,54 294,58
             C285,62 277,68 272,76
             C267,70 263,66 260,62 Z"
          fill="url(#birdLight)"/>

    <!-- small eye -->
    <circle cx="272" cy="66" r="3.2" fill="#0a2a5e"/>
  </g>

  <!-- ============ WORDMARK ============ -->
  <g id="wordmark" font-family="Arial, Helvetica, sans-serif">
    <text x="278" y="108" font-size="50" font-weight="800" letter-spacing="1.5" fill="url(#wordmarkBlue)">MASIKA</text>
    <text x="280" y="146" font-size="33" font-weight="700" letter-spacing="3" fill="#0b2f5e">BENEVOLENT</text>
    <text x="280" y="172" font-size="15" font-weight="700" letter-spacing="1" fill="#1f2933">FUNERAL, BURIAL &amp; BENEVOLENT SERVICES</text>
  </g>

  <!-- ============ TAGLINE ============ -->
  <g id="tagline" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
    <line x1="70" y1="228" x2="150" y2="228" stroke="#d97b29" stroke-width="2"/>
    <text x="340" y="236" font-size="26" fill="#d97b29" text-anchor="middle">A Note You Can Trust</text>
    <line x1="530" y1="228" x2="610" y2="228" stroke="#d97b29" stroke-width="2"/>
  </g>
</svg>
