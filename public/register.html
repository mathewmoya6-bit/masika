    // ============================================================
    // LOAD PLANS

    async function loadPlans() {

        const container = elements.plansContainer;

        if (!container) return;

        let plans = [];

        /*
         * Try backend first.
         *
         * If /api/public/plans does not exist,
         * automatically use PLAN_CONFIG.
         */

        try {

            const response = await fetch(
                `${API_BASE_URL}/public/plans`,
                {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                }
            );

            if (response.ok) {

                const data = await response.json();

                if (Array.isArray(data) && data.length > 0) {
                    plans = data;
                }
            }

        } catch (error) {

            console.warn(
                'Unable to load plans from API. Using local configuration.',
                error
            );
        }

        if (!plans.length) {
            plans = Object.values(PLAN_CONFIG);
        }

        renderPlans(plans);
    }

    function renderPlans(plans) {

        const container = elements.plansContainer;

        if (!container) return;

        if (!plans || plans.length === 0) {

            container.innerHTML =
                '<div class="help-text">No active plans are currently available.</div>';

            return;
        }

        container.innerHTML = plans.map((plan, index) => {

            const slug =
                plan.slug ||
                plan.plan_type ||
                plan.plan ||
                'plan';

            const name =
                plan.name ||
                plan.plan_name ||
                'Plan';

            const description =
                plan.description || '';

            const registrationFee =
                Number(plan.registration_fee || 0);

            const monthlyFee =
                Number(plan.monthly_fee || 0);

            /*
             * JSON is safely encoded for the data attribute.
             */
            const planJson = escapeHtml(
                JSON.stringify({
                    ...plan,
                    slug
                })
            );

            return `
                <div class="plan-option">

                    <input
                        type="radio"
                        name="plan_type"
                        value="${escapeHtml(slug)}"
                        id="plan_${index}"
                        ${index === 0 ? 'checked' : ''}
                        data-plan="${planJson}"
                    >

                    <label
                        for="plan_${index}"
                        class="plan-label"
                    >

                        <div class="plan-name">
                            ${escapeHtml(name)}
                        </div>

                        <div class="plan-description">
                            ${escapeHtml(description)}
                        </div>

                        <div class="plan-price">

                            KES ${registrationFee.toLocaleString()}

                            <small>
                                one-time registration
                            </small>

                            <br>

                            <small>
                                KES ${monthlyFee.toLocaleString()}/month
                            </small>

                        </div>

                    </label>

                </div>
            `;

        }).join('');

        document
            .querySelectorAll('input[name="plan_type"]')
            .forEach(input => {

                input.addEventListener('change', function () {

                    let planData = {};

                    try {
                        planData =
                            JSON.parse(
                                this.dataset.plan || '{}'
                            );
                    } catch (error) {
                        console.error(
                            'Invalid plan data:',
                            error
                        );
                    }

                    selectedPlan =
                        planData.slug
                            ? planData
                            : PLAN_CONFIG.COMFORT;

                    updateSummary();

                    updateDependantEligibility(
                        this.value
                    );
                });
            });

        const firstPlan =
            container.querySelector(
                'input[name="plan_type"]'
            );

        if (firstPlan) {

            firstPlan.checked = true;

            let planData = {};

            try {
                planData =
                    JSON.parse(
                        firstPlan.dataset.plan || '{}'
                    );
            } catch (error) {
                planData = PLAN_CONFIG.COMFORT;
            }

            selectedPlan =
                planData.slug
                    ? planData
                    : PLAN_CONFIG.COMFORT;

            updateDependantEligibility(
                firstPlan.value
            );

            updateSummary();
        }
    }

    // ============================================================
    // LOAD SALES AGENTS
    // ============================================================
    //
    // CORRECT TABLE:
    //
    //     public.sales_agents
    //
    // CORRECT COLUMNS:
    //

    //     full_name
    //     phone
    //     status

    async function loadSalesAgents() {

        const select = elements.salesCode;

        if (!select) {
            console.warn(
                '⚠️ Sales agent select element not found.'
            );
            return;
        }

        select.innerHTML =
            '<option value="">Loading agents...</option>';

        try {

            if (!supabaseClient) {
                throw new Error(
                    'Supabase client is not available.'
                );
            }

            console.log(
                '🔄 Loading active sales agents from public.sales_agents...'
            );

            /*
             * IMPORTANT:
             *
             * Do NOT use:
             *
             *     public_agent_codes
             *     agent_code
             *     is_active
             *
             * The actual database uses:
             *
             *     sales_agents
             *     sales_code
             *     status
             */

            const { data, error } =
                await supabaseClient
                    .from('sales_agents')
                    .select(
                        'sales_code, full_name, phone, status'
                    )
                    .ilike('status', 'active')
                    .order(
                        'full_name',
                        {
                            ascending: true
                        }
                    );

            if (error) {
                throw error;
            }

            allSalesAgents = data || [];

            console.log(
                `✅ Loaded ${allSalesAgents.length} active sales agents.`
            );

            if (!allSalesAgents.length) {

                select.innerHTML =
                    '<option value="">No sales agents available</option>';

                return;
            }

            select.innerHTML =
                '<option value="">Select sales agent</option>';

            allSalesAgents.forEach(agent => {

                if (!agent.sales_code) {
                    return;
                }

                const option =
                    document.createElement('option');

                /*
                 * THIS is the important reference:
                 *
                 * option.value = sales_code
                 */

                option.value =
                    String(agent.sales_code).trim();

                let label =
                    agent.full_name ||
                    agent.sales_code;

                if (agent.phone) {
                    label += ` (${agent.phone})`;
                }

                option.textContent = label;

                select.appendChild(option);
            });

        } catch (error) {

            console.error(
                '❌ Failed to load sales agents:',
                error
            );

            select.innerHTML =
                '<option value="">Unable to load sales agents</option>';

            showAlert(
                `Failed to load sales agents: ${error.message}`,
                'warning'
            );
        }
    }

        const total =
            registrationFee +
            dependantFee;

        elements.summaryPlan.textContent =
            plan.name || 'Plan';

        elements.summaryPrincipal.textContent =
            `KES ${registrationFee.toLocaleString()}`;

        elements.summaryDependants.textContent =
            `KES ${dependantFee.toLocaleString()}`;

        elements.summaryTotal.textContent =
            `KES ${total.toLocaleString()}`;

    function updateDependantEligibility(planSlug) {

            elements.planHelp.textContent =

                '(KES 100 registration fee per parent).';

        } else if (planSlug === 'dignity') {

                'under 18, at no extra registration cost.';

                'Comfort Plan: covers spouse and up to ' +
                '4 children under 18, at no extra registration cost.';
        }
    }

    // ============================================================
    // PHONE NORMALIZATION
    // ============================================================

    function normalizePhone(value) {

        let phone =
            String(value || '')
                .trim()
                .replace(/\s+/g, '')
                .replace(/-/g, '');

        if (!phone) return '';

        if (phone.startsWith('+254')) {

            phone =
                phone.substring(1);

        } else if (phone.startsWith('0')) {

            phone =
                '254' + phone.substring(1);

        } else if (
            /^[17]\d{8}$/.test(phone)
        ) {

            phone =
                '254' + phone;
        }

        return phone;
    }

    // ============================================================
    // FORM DATA
    // ============================================================

    function getFormData() {

        const {
            slug: planSlug
        } = getSelectedPlan();

        const dependants = [];

        document
            .querySelectorAll('.dependant-card')
            .forEach(card => {

                const firstName =
                    card.querySelector(
                        'input[name^="dep_first_name_"]'
                    )?.value.trim() || '';

                const lastName =
                    card.querySelector(
                        'input[name^="dep_last_name_"]'
                    )?.value.trim() || '';

                const relationship =
                    card.querySelector(
                        'select[name^="dep_relationship_"]'
                    )?.value || '';

                const dob =
                    card.querySelector(
                        'input[name^="dep_dob_"]'
                    )?.value || '';

                const phone =
                    normalizePhone(
                        card.querySelector(
                            'input[name^="dep_phone_"]'
                        )?.value || ''
                    );

                dependants.push({
                    first_name: firstName,
                    last_name: lastName,
                    relationship: relationship,
                    date_of_birth: dob,
                    phone: phone || null
                });
            });

        /*
         * IMPORTANT:
         *
         * This retrieves:
         *
         *     sales_agents.sales_code
         *
         * and sends that exact value to FastAPI.
         */

        const salesCode =
            elements.salesCode
                ? (
                    elements.salesCode.value ||
                    null
                )
                : null;

        return {

            first_name:
                $('firstName').value.trim(),

            last_name:
                $('lastName').value.trim(),

            other_name:
                $('otherName').value.trim() || null,

            id_number:
                $('idNumber').value.trim(),

            date_of_birth:
                $('dateOfBirth').value,

            gender:
                $('gender').value,

            phone:
                normalizePhone(
                    $('phone').value
                ),

            alternative_phone:
                normalizePhone(
                    $('alternativePhone').value
                ) || null,

            email:
                $('email').value.trim() || null,

            county:
                $('county').value,

            location:
                $('location').value.trim() || null,

            town:
                $('town').value.trim() || null,

            address:
                $('address').value.trim() || null,

            plan:
                planSlug,

            /*
             * CORRECT SALES AGENT REFERENCE
             */
            sales_code:
                salesCode,

            benefit_option:
                $('benefitOption').value,

            dependants:
                dependants
        };
    }

    // ============================================================
    // VALIDATE INDIVIDUAL REGISTRATION
    // ============================================================

    function validateFormData(data) {

        const required = [
            'first_name',
            'last_name',
            'id_number',
            'date_of_birth',
            'gender',
            'phone',
            'county',
            'benefit_option'
        ];

        for (const field of required) {

            if (
                !data[field] ||
                String(data[field]).trim() === ''
            ) {

                return {
                    valid: false,
                    error:
                        `Please fill in ${field.replace(/_/g, ' ')}`
                };
            }
        }

        if (!/^254[17]\d{8}$/.test(data.phone)) {

            return {
                valid: false,
                error:
                    'Please enter a valid Kenyan phone number.'
            };
        }

        if (data.id_number.length < 5) {

            return {
                valid: false,
                error:
                    'Please enter a valid ID number.'
            };
        }

        const birthDate =
            new Date(data.date_of_birth);

        if (Number.isNaN(birthDate.getTime())) {

            return {
                valid: false,
                error:
                    'Please enter a valid date of birth.'
            };
        }

        const today =
            new Date();

        let age =
            today.getFullYear() -
            birthDate.getFullYear();

        const monthDifference =
            today.getMonth() -
            birthDate.getMonth();

        if (
            monthDifference < 0 ||
            (
                monthDifference === 0 &&
                today.getDate() < birthDate.getDate()
            )
        ) {
            age--;
        }

        if (age < 1 || age > 80) {

            return {
                valid: false,
                error:
                    'Age must be between 1 and 80 years.'
            };
        }

        const parents =
            data.dependants.filter(
                d => d.relationship === 'PARENT'
            );

        const spouses =
            data.dependants.filter(
                d => d.relationship === 'SPOUSE'
            );

        const children =
            data.dependants.filter(
                d => d.relationship === 'CHILD'
            );

        if (spouses.length > 1) {

            return {
                valid: false,
                error:
                    'Only one spouse dependant is allowed.'
            };
        }

        if (children.length > 4) {

            return {
                valid: false,
                error:
                    'A maximum of four children is allowed.'
            };
        }

        if (
            data.plan !== 'wazazi' &&
            parents.length > 0
        ) {

            return {
                valid: false,
                error:
                    'Parent dependants require the Wazazi plan.'
            };
        }

        if (
            data.plan === 'wazazi' &&
            parents.length > 4
        ) {

            return {
                valid: false,
                error:
                    'Wazazi allows a maximum of four parents.'
            };
        }

        for (
            let i = 0;
            i < data.dependants.length;
            i++
        ) {

            const dependant =
                data.dependants[i];

            const number =
                i + 1;

            if (
                !dependant.first_name ||
                !dependant.last_name
            ) {

                return {
                    valid: false,
                    error:
                        `Please complete the name for dependant ${number}.`
                };
            }

            if (!dependant.relationship) {

                return {
                    valid: false,
                    error:
                        `Please select a relationship for dependant ${number}.`
                };
            }

            if (!dependant.date_of_birth) {

                return {
                    valid: false,
                    error:
                        `Please enter a date of birth for dependant ${number}.`
                };
            }
        }

        return {
            valid: true
        };
    }

    // ============================================================
    // INDIVIDUAL REGISTRATION
    // ============================================================

    async function handleRegistration(event) {

        event.preventDefault();

        if (isSubmitting) return;

        clearAlert();

        const formData =
            getFormData();

        console.log(
            '📝 Registration payload:',
            formData
        );

        const validation =
            validateFormData(formData);

        if (!validation.valid) {

            showAlert(
                validation.error,
                'error'
            );

            return;
        }

        isSubmitting = true;

        setLoading(
            true,
            'Creating your registration...'
        );

        try {

            const response =
                await fetch(
                    `${API_BASE_URL}/public/register`,
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json',

                            'Accept':
                                'application/json'
                        },

                        body:
                            JSON.stringify(formData)
                    }
                );

            const result =
                await response.json();

            if (
                !response.ok ||
                !result.success
            ) {

                const detail =
                    Array.isArray(result.detail)
                        ? result.detail
                            .map(
                                d => d.msg
                            )
                            .join(' | ')
                        : (
                            result.detail ||
                            result.message
                        );

                throw new Error(
                    detail ||
                    'Registration failed.'
                );
            }

            /*
             * MEMBER IDENTIFIER
             *
             * Payment uses member_id.
             * member_number is only stored if
             * the backend returns it.
             */

            const memberId =
                result.member_id ||
                result.id;

            if (!memberId) {

                throw new Error(
                    'Registration succeeded but no member ID was returned.'
                );
            }

            /*
             * Backend amount is authoritative.
             *
             * Frontend calculation is only a fallback.
             */

            const {
                plan
            } = getSelectedPlan();

            const frontendPrincipal =
                Number(
                    plan.registration_fee || 0
                );

            const parentCount =
                formData.dependants.filter(
                    d =>
                        d.relationship === 'PARENT'
                ).length;

            const frontendDependantFee =
                formData.plan === 'wazazi'
                    ? parentCount *
                      WAZAZI_PARENT_FEE
                    : 0;

            const frontendTotal =
                frontendPrincipal +
                frontendDependantFee;

            const registrationAmount =
                Number(
                    result.registration_amount ??
                    result.amount ??
                    frontendTotal
                );

            /*
             * Store payment/session information.
             */

            sessionStorage.setItem(
                'newMemberId',
                String(memberId)
            );

            if (result.member_number) {

                sessionStorage.setItem(
                    'newMemberNumber',
                    String(
                        result.member_number
                    )
                );
            }

            sessionStorage.setItem(
                'newMemberName',
                `${formData.first_name} ${formData.last_name}`.trim()
            );

            sessionStorage.setItem(
                'newMemberPhone',
                formData.phone
            );

            sessionStorage.setItem(
                'registrationAmount',
                String(registrationAmount)
            );

            sessionStorage.setItem(
                'isChamaRegistration',
                'false'
            );

            /*
             * Keep the selected sales code available
             * for payment/receipt flows if required.
             */

            if (formData.sales_code) {

                sessionStorage.setItem(
                    'newSalesCode',
                    formData.sales_code
                );
            }

            console.log(
                '✅ Registration created',
                {
                    member_id: memberId,
                    sales_code:
                        formData.sales_code,
                    amount:
                        registrationAmount
                }
            );

            showAlert(
                'Registration successful! Redirecting to payment...',
                'success'
            );

            setTimeout(() => {

                window.location.href =
                    `payment.html?member_id=${encodeURIComponent(memberId)}`;

            }, 1200);

        } catch (error) {

            console.error(
                '❌ Registration error:',
                error
            );

            showAlert(
                error.message ||
                'Registration failed. Please try again.',
                'error'
            );

        } finally {

            isSubmitting = false;

            setLoading(
                false
            );
        }
    }

    // ============================================================
    // CHAMA REGISTRATION
    // ============================================================

    async function handleChamaRegistration(event) {

        event.preventDefault();

        if (isSubmitting) return;

        clearAlert();

        const chamaName =
            $('chamaName')
                .value
                .trim();

        const chamaPhone =
            normalizePhone(
                $('chamaPhone').value
            );

        const chairperson = {
            name:
                $('chairpersonName')
                    .value
                    .trim(),

            phone:
                normalizePhone(
                    $('chairpersonPhone').value
                ),

            id_number:
                $('chairpersonId')
                    .value
                    .trim()
        };

        const treasurer = {
            name:
                $('treasurerName')
                    .value
                    .trim(),

            phone:
                normalizePhone(
                    $('treasurerPhone').value
                ),

            id_number:
                $('treasurerId')
                    .value
                    .trim()
        };

        const secretary = {
            name:
                $('secretaryName')
                    .value
                    .trim(),

            phone:
                normalizePhone(
                    $('secretaryPhone').value
                ),

            id_number:
                $('secretaryId')
                    .value
                    .trim()
        };

        if (!chamaName) {

            showAlert(
                'Please enter the chama/group name.',
                'error'
            );

            return;
        }

        if (
            !/^254[17]\d{8}$/.test(
                chamaPhone
            )
        ) {

            showAlert(
                'Please enter a valid group contact phone.',
                'error'
            );

            return;
        }

        for (
            const [label, official]
            of [
                ['Chairperson', chairperson],
                ['Treasurer', treasurer],
                ['Secretary', secretary]
            ]
        ) {

            if (!official.name) {

                showAlert(
                    `${label} name is required.`,
                    'error'
                );

                return;
            }

            if (
                !/^254[17]\d{8}$/.test(
                    official.phone
                )
            ) {

                showAlert(
                    `${label} phone number is invalid.`,
                    'error'
                );

                return;
            }

            if (!official.id_number) {

                showAlert(
                    `${label} ID is required.`,
                    'error'
                );

                return;
            }
        }

        if (
            parsedChamaMembers.length <
            MIN_CHAMA_MEMBERS
        ) {

            showAlert(
                `Minimum ${MIN_CHAMA_MEMBERS} members required. Currently ${parsedChamaMembers.length}.`,
                'error'
            );

            return;
        }

        const normalizedMembers =
            parsedChamaMembers.map(member => ({
                first_name:
                    String(
                        member.first_name || ''
                    ).trim(),

                last_name:
                    String(
                        member.last_name || ''
                    ).trim(),

                phone:
                    normalizePhone(
                        member.phone
                    ),

                id_number:
                    String(
                        member.id_number || ''
                    ).trim(),

                date_of_birth:
                    String(
                        member.date_of_birth || ''
                    ).trim(),

                gender:
                    String(
                        member.gender || ''
                    )
                    .trim()
                    .toUpperCase()
            }));

        isSubmitting = true;

        setLoading(
            true,
            'Creating chama registration...'
        );

        try {

            const payload = {

                group_name:
                    chamaName,

                phone:
                    chamaPhone,

                chairperson,

                treasurer,

                secretary,

                members:
                    normalizedMembers
            };

            const response =
                await fetch(
                    `${API_BASE_URL}/public/register/chama`,
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json',

                            'Accept':
                                'application/json'
                        },

                        body:
                            JSON.stringify(payload)
                    }
                );

            const result =
                await response.json();

            if (
                !response.ok ||
                !result.success
            ) {

                const detail =
                    Array.isArray(result.detail)
                        ? result.detail
                            .map(
                                d => d.msg
                            )
                            .join(' | ')
                        : (
                            result.detail ||
                            result.message
                        );

                throw new Error(
                    detail ||
                    'Chama registration failed.'
                );
            }

            const groupId =
                result.group_id ||
                result.chama_group_id ||
                result.id;

            if (!groupId) {

                throw new Error(
                    'Chama registration succeeded but no group ID was returned.'
                );
            }

            const totalAmount =
                Number(
                    result.registration_amount ??
                    result.amount ??
                    (
                        normalizedMembers.length *
                        CHAMA_REGISTRATION_RATE
                    )
                );

            sessionStorage.setItem(
                'newChamaGroupId',
                String(groupId)
            );

            sessionStorage.setItem(
                'newChamaGroupName',
                chamaName
            );

            sessionStorage.setItem(
                'newChamaMemberCount',
                String(
                    normalizedMembers.length
                )
            );

            sessionStorage.setItem(
                'newChamaPhone',
                chamaPhone
            );

            sessionStorage.setItem(
                'registrationAmount',
                String(totalAmount)
            );

            sessionStorage.setItem(
                'isChamaRegistration',
                'true'
            );

            showAlert(
                `Chama registration successful! ${normalizedMembers.length} members loaded. Redirecting to payment...`,
                'success'
            );

            setTimeout(() => {

                window.location.href =
                    `payment.html?group_id=${encodeURIComponent(groupId)}`;

            }, 1200);

        } catch (error) {

            console.error(
                '❌ Chama registration error:',
                error
            );

            showAlert(
                error.message ||
                'Chama registration failed.',
                'error'
            );

        } finally {

            isSubmitting = false;

            setLoading(
                false
            );
        }
    }

    // ============================================================
    // CHAMA CSV
    // ============================================================

    function handleChamaCsv(event) {

        const file =
            event.target.files?.[0];

        if (!file) {

            parsedChamaMembers = [];

            renderChamaPreview();

            return;
        }

        clearAlert();

        if (
            !file.name
                .toLowerCase()
                .endsWith('.csv')
        ) {

            parsedChamaMembers = [];

            renderChamaPreview();

            showAlert(
                'Please upload a CSV file.',
                'error'
            );

            return;
        }

        const reader =
            new FileReader();

        reader.onload = function (event) {

            const csv =
                event.target.result;

            const result =
                Papa.parse(
                    csv,
                    {
                        header: true,
                        skipEmptyLines: true,
                        trimHeaders: true,

                        transformHeader:
                            header =>
                                String(
                                    header || ''
                                )
                                .trim()
                                .toLowerCase()
                                .replace(
                                    /\s+/g,
                                    '_'
                                )
                    }
                );

            if (
                result.errors &&
                result.errors.length
            ) {

                showAlert(
                    'Error parsing CSV: ' +
                    result.errors[0].message,
                    'error'
                );

                return;
            }

            const requiredColumns = [
                'first_name',
                'last_name',
                'phone',
                'id_number',
                'date_of_birth',
                'gender'
            ];

            const headers =
                Object.keys(
                    result.data[0] || {}
                );

            const missing =
                requiredColumns.filter(
                    column =>
                        !headers.includes(
                            column
                        )
                );

            if (missing.length) {

                showAlert(
                    `CSV missing required columns: ${missing.join(', ')}`,
                    'error'
                );

                parsedChamaMembers = [];

                renderChamaPreview();

                return;
            }

            parsedChamaMembers =
                result.data.filter(
                    row =>
                        row.first_name &&
                        row.last_name &&
                        row.phone &&
                        row.id_number &&
                        row.date_of_birth &&
                        row.gender
                );

            renderChamaPreview();

            if (
                parsedChamaMembers.length <
                MIN_CHAMA_MEMBERS
            ) {

                showAlert(
                    `Only ${parsedChamaMembers.length} valid members found. Minimum ${MIN_CHAMA_MEMBERS} required.`,
                    'warning'
                );

            } else {

                showAlert(
                    `Successfully loaded ${parsedChamaMembers.length} members.`,
                    'success'
                );
            }
        };

        reader.readAsText(file);
    }

    function renderChamaPreview() {

        const members =
            parsedChamaMembers;

        elements.chamaMemberCount
            .textContent =
                members.length;

        const total =
            members.length *
            CHAMA_REGISTRATION_RATE;

        elements.chamaTotal
            .textContent =
                `KES ${total.toLocaleString()}`;

        const preview =
            elements.csvPreview;

        const count =
            elements.csvCount;

        if (!members.length) {

            preview.classList.remove('show');

            preview.innerHTML = '';

            count.textContent = '';

            return;
        }

        count.textContent =
            `${members.length} member(s) loaded.`;

        const headers = [
            'first_name',
            'last_name',
            'phone',
            'id_number',
            'gender'
        ];

        let html =
            '<table><thead><tr>';

        headers.forEach(header => {

            html +=
                `<th>${header.replace(/_/g, ' ').toUpperCase()}</th>`;
        });

        html +=
            '</tr></thead><tbody>';

        members
            .slice(0, 10)
            .forEach(row => {

                html += '<tr>';

                headers.forEach(header => {

                    html +=
                        `<td>${escapeHtml(row[header] || '')}</td>`;
                });

                html += '</tr>';
            });

        if (members.length > 10) {

            html += `
                <tr>
                    <td
                        colspan="${headers.length}"
                        style="text-align:center;font-weight:700;"
                    >
                        ... and ${members.length - 10} more rows
                    </td>
                </tr>
            `;
        }

        html +=
            '</tbody></table>';

        preview.innerHTML =
            html;

        preview.classList.add('show');
    }

    // ============================================================
    // RESET
    // ============================================================

    function resetIndividualForm() {

        if (
            !confirm(
                'Reset this registration form?'
            )
        ) {
            return;
        }

        elements.registrationForm.reset();

        elements.dependantsContainer
            .innerHTML = '';

        selectedPlan =
            PLAN_CONFIG.COMFORT;

        const firstPlan =
            document.querySelector(
                'input[name="plan_type"]'
            );

        if (firstPlan) {

            firstPlan.checked = true;

            try {

                selectedPlan =
                    JSON.parse(
                        firstPlan.dataset.plan ||
                        '{}'
                    );

            } catch (error) {

                selectedPlan =
                    PLAN_CONFIG.COMFORT;
            }
        }

        updateSummary();

        clearAlert();
    }

    function resetChamaForm() {

        if (
            !confirm(
                'Reset this chama registration?'
            )
        ) {
            return;
        }

        elements.chamaForm.reset();

        parsedChamaMembers = [];

        renderChamaPreview();

        clearAlert();
    }

    // ============================================================
    // ALERTS
    // ============================================================

    function showAlert(
        message,
        type = 'info'
    ) {

        const alertBox =
            elements.alertBox;

        alertBox.className =
            `alert show ${type}`;

        alertBox.textContent =
            message;

        alertBox.style.display =
            'block';
    }

    function clearAlert() {

        const alertBox =
            elements.alertBox;

        alertBox.className =
            'alert';

        alertBox.textContent =
            '';

        alertBox.style.display =
            'none';
    }

    // ============================================================
    // LOADING
    // ============================================================

    function setLoading(
        loading,
        message = 'Processing...'
    ) {

        elements.loadingText
            .textContent =
                message;

        elements.loadingBox
            .classList.toggle(
                'show',
                loading
            );

        if (elements.submitBtn) {
            elements.submitBtn.disabled =
                loading;
        }

        if (elements.chamaSubmitBtn) {
            elements.chamaSubmitBtn.disabled =
                loading;
        }
    }

    // ============================================================
    // HTML ESCAPING
    // ============================================================

    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return '';
        }

        return String(value)
            .replace(
                /&/g,
                '&amp;'
            )
            .replace(
                /</g,
                '&lt;'
            )
            .replace(
                />/g,
                '&gt;'
            )
            .replace(
                /"/g,
                '&quot;'
            )
            .replace(
                /'/g,
                '&#039;'
            );
    }

    // ============================================================
    // EXPOSE FUNCTIONS
    // ============================================================

    window.removeDependant =
        removeDependant;

    window.addDependant =
        addDependant;

    window.updateSummary =
        updateSummary;

    window.showAlert =
        showAlert;

    window.clearAlert =
        clearAlert;

    window.loadPlans =
        loadPlans;

    window.loadSalesAgents =
        loadSalesAgents;

    window.normalizePhone =
        normalizePhone;

    window.escapeHtml =
        escapeHtml;

    console.log(
        '✅ Masika registration JavaScript ready'
    );

    console.log(
        '👤 Sales agents: public.sales_agents.sales_code'
    );

    console.log(
        '👤 Registration payload field: sales_code'
    );

    console.log(
        '🆔 Payment identifier: member_id'
    );
</script>
