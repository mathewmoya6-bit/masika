<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sales Agents | Masika Benevolent</title>
<link rel="icon" href="assets/masika-bird.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
<style>
:root{--g:#176b3a;--gd:#0f4d2a;--bg:#f5f7f6;--w:#fff;--t:#17201b;--m:#68746d;--b:#dfe6e1;--d:#b42318;--x:#a15c00}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--t)}header{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;padding:18px 24px}.head{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center}.brand img{width:44px;height:44px;background:#fff;border-radius:10px;padding:4px}.brand h1{margin:0;font-size:20px}.brand p{margin:3px 0 0;font-size:13px;opacity:.8}.admin{text-align:right;font-size:13px}.admin strong{display:block}main{max-width:1200px;margin:28px auto;padding:0 18px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:20px}.toolbar h2{margin:0;font-size:24px}.toolbar p{margin:5px 0;color:var(--m);font-size:14px}.btn{border:0;border-radius:9px;padding:11px 16px;cursor:pointer;font-weight:700}.primary{background:var(--g);color:#fff}.primary:hover{background:var(--gd)}.secondary{background:#eef3ef;color:var(--gd)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}.stat,.card{background:var(--w);border:1px solid var(--b);border-radius:12px;box-shadow:0 8px 24px rgba(16,42,28,.08)}.stat{padding:18px}.stat span{color:var(--m);font-size:13px}.stat strong{display:block;font-size:28px;margin-top:5px;color:var(--gd)}.card{overflow:hidden}.cardhead{padding:16px 18px;border-bottom:1px solid var(--b);display:flex;justify-content:space-between}.cardhead h3{margin:0}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:13px 15px;text-align:left;border-bottom:1px solid var(--b);font-size:14px}th{background:#f8faf8;color:var(--m);font-size:12px;text-transform:uppercase}tr:last-child td{border:0}.wrap{overflow:auto}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}.active{background:#e7f6ed;color:var(--g)}.suspended{background:#fff4dc;color:var(--x)}.inactive{background:#f0f1f1;color:#59615c}.actions button{border:1px solid var(--b);background:#fff;border-radius:7px;padding:7px 9px;cursor:pointer;font-weight:700}.empty,.loading{text-align:center;padding:40px;color:var(--m)}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;padding:20px}.modal.show{display:flex;align-items:center;justify-content:center}.modalbox{width:min(620px,100%);background:#fff;border-radius:14px}.modalhead{padding:18px 20px;border-bottom:1px solid var(--b);display:flex;justify-content:space-between}.modalhead h3{margin:0}.close{border:0;background:none;font-size:25px;cursor:pointer}form{padding:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}label{font-size:13px;font-weight:700}input,select{padding:11px 12px;border:1px solid #ccd6cf;border-radius:8px;font:inherit}.formactions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.error{display:none;background:#fff0ee;color:var(--d);border:1px solid #f3c4bd;border-radius:8px;padding:10px;margin-bottom:15px;font-size:13px}.toast{display:none;position:fixed;right:20px;bottom:20px;z-index:20;color:#fff;padding:13px 15px;border-radius:9px;max-width:420px}.toast.show{display:block}.toast.success{background:var(--g)}.toast.error{background:var(--d)}.toast.warning{background:var(--x)}@media(max-width:700px){.stats{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.full{grid-column:auto}.admin{display:none}}
</style>
</head>
<body>
<header><div class="head"><div class="brand"><img src="assets/masika-bird.png" alt="Masika Benevolent"><div><h1>Masika Benevolent</h1><p>Sales Agent Management</p></div></div><div class="admin"><strong id="adminName">Checking session...</strong><span id="adminRole"></span></div></div></header>
<main>
<div class="toolbar"><div><h2>Sales Agents</h2><p>Create and manage Masika Benevolent sales agents.</p></div><div><button class="btn secondary" id="refresh" type="button">Refresh</button> <button class="btn primary" id="newAgent" type="button">+ New Agent</button></div></div>
<div class="stats"><div class="stat"><span>Total Agents</span><strong id="total">0</strong></div><div class="stat"><span>Active</span><strong id="active">0</strong></div><div class="stat"><span>Inactive / Suspended</span><strong id="inactive">0</strong></div></div>
<section class="card"><div class="cardhead"><h3>Agent List</h3><span id="listStatus"></span></div><div class="wrap"><table><thead><tr><th>Sales Code</th><th>Name</th><th>Phone</th><th>Email</th><th>National ID</th><th>Branch</th><th>Status</th><th>Actions</th></tr></thead><tbody id="body"><tr><td colspan="8" class="loading">Loading agents...</td></tr></tbody></table></div></section>
</main>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h3>Create Sales Agent</h3><button class="close" id="close" type="button">&times;</button></div><form id="form"><div id="formError" class="error"></div><div class="fields"><div class="field full"><label for="name">Full Name *</label><input id="name" required maxlength="150"></div><div class="field"><label for="phone">Phone</label><input id="phone" maxlength="30"></div><div class="field"><label for="email">Email</label><input id="email" type="email" maxlength="150"></div><div class="field"><label for="nid">National ID</label><input id="nid" maxlength="30"></div><div class="field"><label for="branch">Branch *</label><select id="branch" required><option value="">Select branch</option></select></div></div><div class="formactions"><button class="btn secondary" id="cancel" type="button">Cancel</button><button class="btn primary" id="save" type="submit">Create Agent</button></div></form></div></div>
<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://wpxzlcdrirlcyvfiquld.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndweHpsY2RyaWxjeXZmaXF1bGQiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4NzkyNzgwNywiZXhwIjoyMTAzNTAzODA3fQ.OUP9pmPbrML_egpHflZtDfLv1_UDM37_BYjtb842xjg';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let branches=[],agents=[];
const $=id=>document.getElementById(id);
const status=v=>String(v||'INACTIVE').trim().toUpperCase();
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function toast(type,msg){const x=$('toast');x.className='toast '+type+' show';x.textContent=msg;clearTimeout(toast.t);toast.t=setTimeout(()=>x.className='toast',4500)}
function errMsg(e){const m=String(e?.message||e?.details||e?.hint||'Unexpected error');const l=m.toLowerCase();if(l.includes('row-level security')||l.includes('rls'))return'Permission denied by Supabase RLS. Check sales_agents policies.';if(l.includes('duplicate')||l.includes('unique constraint'))return'A record with the same unique value already exists.';if(l.includes('foreign key'))return'The selected branch is invalid or no longer exists.';if(l.includes('does not exist')||l.includes('schema cache'))return'The database structure does not match this page. Check sales_agents columns.';return m}
async function auth(){const {data:{session},error:e}=await supabaseClient.auth.getSession();if(e)throw e;if(!session?.user){location.href='login.html';return false}const {data:staff,error}=await supabaseClient.from('staff').select('id,auth_user_id,full_name,email,phone,role_id,branch_id,status,sales_code,roles:role_id(id,role_code,role_name,is_active)').eq('auth_user_id',session.user.id).maybeSingle();if(error)throw error;if(!staff){await supabaseClient.auth.signOut();location.href='login.html';return false}const role=String(staff.roles?.role_code||'').toUpperCase();if(staff.roles?.is_active!==true||status(staff.status)!=='ACTIVE'||!['SUPER_ADMIN','ADMIN'].includes(role)){await supabaseClient.auth.signOut();alert('You are not authorized to access this page.');location.href='login.html';return false}$('adminName').textContent=staff.full_name||staff.email||'Administrator';$('adminRole').textContent=staff.roles?.role_name||role;localStorage.setItem('admin_user',JSON.stringify({id:staff.id,full_name:staff.full_name,email:staff.email,role_code:role}));return true}
async function loadBranches(){const {data,error}=await supabaseClient.from('branches').select('id,branch_name,branch_code,is_active').eq('is_active',true).order('branch_name',{ascending:true});if(error)throw error;branches=data||[];$('branch').innerHTML='<option value="">Select branch</option>'+branches.map(b=>`<option value="${esc(b.id)}">${esc(b.branch_name)}${b.branch_code?' ('+esc(b.branch_code)+')':''}</option>`).join('');if(!branches.length)toast('warning','No active branches are available. Add a branch first.')}
function branchName(id){return branches.find(b=>String(b.id)===String(id))?.branch_name||'—'}
async function loadAgents(){$('body').innerHTML='<tr><td colspan="8" class="loading">Loading agents...</td></tr>';const {data,error}=await supabaseClient.from('sales_agents').select('*').order('created_at',{ascending:false});if(error)throw error;agents=data||[];render()}
function render(){const a=agents.filter(x=>status(x.status)==='ACTIVE').length;$('total').textContent=agents.length;$('active').textContent=a;$('inactive').textContent=agents.length-a;if(!agents.length){$('body').innerHTML='<tr><td colspan="8" class="empty">No sales agents have been created yet.</td></tr>';return}$('body').innerHTML=agents.map(x=>{const s=status(x.status),cls=s==='ACTIVE'?'active':s==='SUSPENDED'?'suspended':'inactive',next=s==='ACTIVE'?'SUSPENDED':'ACTIVE',text=s==='ACTIVE'?'Suspend':'Activate';return `<tr><td><strong>${esc(x.sales_code||'Pending')}</strong></td><td>${esc(x.full_name)}</td><td>${esc(x.phone||'—')}</td><td>${esc(x.email||'—')}</td><td>${esc(x.national_id||'—')}</td><td>${esc(branchName(x.branch_id))}</td><td><span class="badge ${cls}">${esc(s)}</span></td><td><div class="actions"><button type="button" class="statusBtn" data-id="${esc(x.id)}" data-status="${next}">${text}</button></div></td></tr>`}).join('');document.querySelectorAll('.statusBtn').forEach(b=>b.onclick=()=>changeStatus(b.dataset.id,b.dataset.status))}
async function create(e){e.preventDefault();$('formError').style.display='none';const full_name=$('name').value.trim(),email=$('email').value.trim(),phone=$('phone').value.trim(),national_id=$('nid').value.trim(),branch_id=$('branch').value;if(!full_name)return formError('Full name is required.');if(!branch_id)return formError('Please select a branch.');$('save').disabled=true;$('save').textContent='Creating...';try{const {data:{session}}=await supabaseClient.auth.getSession();if(!session?.user)throw new Error('Your session has expired. Please log in again.');const {data,error}=await supabaseClient.from('sales_agents').insert({full_name,email:email||null,phone:phone||null,national_id:national_id||null,branch_id,status:'ACTIVE'}).select('*').single();if(error)throw error;closeModal();$('form').reset();toast('success',data?.sales_code?'Sales agent created. Code: '+data.sales_code:'Sales agent created successfully.');await loadAgents()}catch(e){const m=errMsg(e);formError(m);toast('error',m)}finally{$('save').disabled=false;$('save').textContent='Create Agent'}}
function formError(m){$('formError').textContent=m;$('formError').style.display='block'}
async function changeStatus(id,newStatus){const a=agents.find(x=>String(x.id)===String(id));if(!a)return toast('error','Agent not found.');const action=newStatus==='ACTIVE'?'activate':'suspend';if(!confirm(`Are you sure you want to ${action} ${a.full_name}?`))return;try{const {data:{session}}=await supabaseClient.auth.getSession();if(!session?.user)throw new Error('Your session has expired. Please log in again.');const {error}=await supabaseClient.from('sales_agents').update({status:newStatus,updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;toast('success',`${a.full_name} is now ${newStatus}.`);await loadAgents()}catch(e){toast('error',errMsg(e))}}
function openModal(){$('form').reset();$('formError').style.display='none';$('modal').classList.add('show');setTimeout(()=>$('name').focus(),50)}
function closeModal(){$('modal').classList.remove('show')}
async function refresh(){try{$('listStatus').textContent='Refreshing...';if(!await auth())return;await loadBranches();await loadAgents();$('listStatus').textContent=''}catch(e){$('listStatus').textContent='';toast('error',errMsg(e))}}
document.addEventListener('DOMContentLoaded',async()=>{$('newAgent').onclick=openModal;$('close').onclick=closeModal;$('cancel').onclick=closeModal;$('refresh').onclick=refresh;$('form').onsubmit=create;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});try{if(!await auth())return;await loadBranches();await loadAgents()}catch(e){console.error(e);toast('error',errMsg(e))}});
</script>
</body>
</html>
