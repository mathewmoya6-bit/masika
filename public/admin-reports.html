<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | Masika Benevolent</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/branding/favicon-32.png">

    <!-- =========================================================
         SUPABASE & EXTERNAL JS
         ========================================================= -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0b5d3b;
            --primary-dark: #06452c;
            --primary-light: #e8f5ee;
            --gold: #d4a843;
            --gold-light: #f5e6b8;

            --danger: #dc3545;
            --danger-light: #fce4e8;

            --success: #198754;
            --success-light: #d4edda;

            --warning: #ffc107;
            --warning-light: #fff3cd;

            --info: #0dcaf0;
            --info-light: #d1f0f9;

            --purple: #6f42c1;
            --purple-light: #ece3fb;

            --text: #1f2933;
            --text-light: #6b7280;
            --text-lighter: #9ca3af;

            --white: #ffffff;

            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;

            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 4px 24px rgba(0, 0, 0, 0.12);

            --radius: 12px;
            --radius-lg: 16px;
            --transition: all 0.3s ease;
        }

        body {
            font-family:
                'Inter',
                -apple-system,
                BlinkMacSystemFont,
                'Segoe UI',
                Arial,
                sans-serif;
            background: #f0f4f2;
            color: var(--text);
            min-height: 100vh;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--gray-100);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--gray-400);
        }

        .admin-layout {
            display: flex;
            min-height: 100vh;
        }

        /* =========================================================
           SIDEBAR
           ========================================================= */

        .sidebar {
            width: 280px;
            background: var(--primary);
            color: white;
            padding: 24px 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            transition: var(--transition);
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .sidebar-brand {
            padding: 0 24px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .sidebar-brand .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }

        .sidebar-brand .logo-icon {
            width: 44px;
            height: 44px;
            background: var(--gold);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: var(--white);
            font-size: 20px;
        }

        .sidebar-brand .logo-text {
            font-weight: 800;
            font-size: 20px;
            letter-spacing: -0.5px;
        }

        .sidebar-brand .logo-sub {
            font-size: 11px;
            opacity: 0.6;
            display: block;
            font-weight: 400;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .sidebar-nav {
            list-style: none;
            padding: 0 12px;
            flex: 1;
        }

        .sidebar-nav li {
            margin-bottom: 2px;
        }

        .sidebar-nav .nav-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: rgba(255, 255, 255, 0.3);
            padding: 12px 16px 6px;
            font-weight: 700;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 16px;
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.65);
            text-decoration: none;
            transition: var(--transition);
            font-size: 14px;
            font-weight: 500;
            position: relative;
        }

        .sidebar-nav a:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        .sidebar-nav a.active {
            background: rgba(255, 255, 255, 0.12);
            color: white;
        }

        .sidebar-nav a.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 20%;
            height: 60%;
            width: 3px;
            background: var(--gold);
            border-radius: 0 3px 3px 0;
        }

        .sidebar-nav a i {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: auto;
            flex-shrink: 0;
        }

        .sidebar-footer .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-footer .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: white;
            flex-shrink: 0;
        }

        .sidebar-footer .user-name {
            font-weight: 600;
            font-size: 14px;
        }

        .sidebar-footer .user-role {
            font-size: 12px;
            opacity: 0.5;
        }

        .sidebar-footer .logout-btn {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
        }

        .sidebar-footer .logout-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* =========================================================
           SIDEBAR BACKDROP
           ========================================================= */

        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 99;
        }

        .sidebar-backdrop.show {
            display: block;
        }

        /* =========================================================
           MAIN CONTENT
           ========================================================= */

        .main-content {
            margin-left: 280px;
            padding: 24px 32px 40px;
            flex: 1;
            width: calc(100% - 280px);
            min-height: 100vh;
        }

        /* =========================================================
           TOPBAR
           ========================================================= */

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .topbar h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .topbar h1 small {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-light);
            display: block;
            margin-top: 2px;
        }

        .topbar .actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .topbar .actions .date-time {
            font-size: 14px;
            color: var(--text-light);
            font-weight: 500;
        }

        /* =========================================================
           BUTTONS
           ========================================================= */

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(11, 93, 59, 0.3);
        }

        .btn-gold {
            background: var(--gold);
            color: white;
        }

        .btn-gold:hover {
            background: #c49a3a;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(212, 168, 67, 0.3);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #157347;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(25, 135, 84, 0.3);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(220, 53, 69, 0.3);
        }

        .btn-info {
            background: var(--info);
            color: white;
        }

        .btn-info:hover {
            background: #0bb5d8;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(13, 202, 240, 0.3);
        }

        .btn-purple {
            background: var(--purple);
            color: white;
        }

        .btn-purple:hover {
            background: #5a34a0;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(111, 66, 193, 0.3);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--gray-200);
            color: var(--text-light);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 6px;
        }

        .btn-block {
            width: 100%;
            justify-content: center;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* =========================================================
           REPORT GRID
           ========================================================= */

        .report-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 24px;
        }

        /* =========================================================
           CARDS
           ========================================================= */

        .card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--gray-200);
        }

        .card-header h3 {
            font-size: 17px;
            font-weight: 700;
        }

        .card-header i {
            font-size: 20px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .card-header i.payments-icon {
            background: var(--success);
        }

        .card-header i.members-icon {
            background: var(--gold);
        }

        .card-header i.dependants-icon {
            background: var(--info);
        }

        .card-header i.memberdep-icon {
            background: var(--purple);
        }

        /* =========================================================
           FILTERS
           ========================================================= */

        .filter-group {
            margin-bottom: 14px;
        }

        .filter-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-light);
        }

        .filter-group input,
        .filter-group select {
            width: 100%;
            padding: 9px 12px;
            border: 2px solid var(--gray-200);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            transition: var(--transition);
            background: white;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(11, 93, 59, 0.1);
        }

        .filter-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* =========================================================
           REPORT STATUS
           ========================================================= */

        .report-status {
            font-size: 13px;
            margin-top: 10px;
            min-height: 20px;
            padding: 8px 12px;
            border-radius: 6px;
        }

        .report-status.error {
            color: var(--danger);
            background: var(--danger-light);
        }

        .report-status.success {
            color: var(--success);
            background: var(--success-light);
        }

        .report-status.info {
            color: #055160;
            background: var(--info-light);
        }

        .report-status.warning {
            color: #856404;
            background: var(--warning-light);
        }

        /* =========================================================
           TOAST
           ========================================================= */

        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 420px;
        }

        .toast {
            padding: 14px 20px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            animation: slideIn 0.4s ease;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toast:hover {
            transform: scale(1.02);
        }

        .toast.success {
            background: var(--success);
        }

        .toast.error {
            background: var(--danger);
        }

        .toast.info {
            background: var(--info);
            color: var(--text);
        }

        .toast.warning {
            background: var(--warning);
            color: var(--text);
        }

        .toast .toast-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-size: 18px;
            margin-left: auto;
            padding: 0 4px;
        }

        .toast .toast-close:hover {
            color: white;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */

        .sidebar-toggle {
            display: none;
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition);
        }

        .sidebar-toggle:hover {
            background: var(--primary-dark);
        }

        @media (max-width: 1024px) {
            .report-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                width: 280px;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
                width: 100%;
                padding: 16px;
            }

            .sidebar-toggle {
                display: block;
            }

            .topbar .actions .date-time {
                display: none;
            }

            .topbar h1 {
                font-size: 22px;
            }

            .report-grid {
                grid-template-columns: 1fr;
            }

            .filter-row {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .topbar {
                flex-direction: column;
                align-items: stretch;
            }

            .topbar .actions {
                justify-content: flex-start;
            }
        }
    </style>
</head>

<body>

<div class="admin-layout">

    <!-- =========================================================
         SIDEBAR BACKDROP
         ========================================================= -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- =========================================================
         SIDEBAR
         ========================================================= -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-brand">
            <a href="admin-dashboard.html" class="logo">
                <div class="logo-icon">MB</div>
                <div>
                    <span class="logo-text">Masika</span>
                    <span class="logo-sub">Admin Panel</span>
                </div>
            </a>
        </div>

        <ul class="sidebar-nav">

            <li class="nav-label">Main</li>

            <li>
                <a href="admin-dashboard.html">
                    <i class="fas fa-chart-pie"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="admin-members.html">
                    <i class="fas fa-users"></i>
                    Members
                </a>
            </li>

            <li>
                <a href="admin-agents.html">
                    <i class="fas fa-user-tie"></i>
                    Agents
                </a>
            </li>

            <li class="nav-label">Finance</li>

            <li>
                <a href="admin-collectpayments.html">
                    <i class="fas fa-credit-card"></i>
                    Payments
                </a>
            </li>

            <li>
                <a href="admin-revenue.html">
                    <i class="fas fa-chart-line"></i>
                    Revenue
                </a>
            </li>

            <li class="nav-label">Settings</li>

            <li>
                <a href="admin-reports.html" class="active">
                    <i class="fas fa-file-alt"></i>
                    Reports
                </a>
            </li>

            <li>
                <a href="admin-pricing.html">
                    <i class="fas fa-tags"></i>
                    Pricing
                </a>
            </li>

            <li>
                <a href="admin-settings.html">
                    <i class="fas fa-cog"></i>
                    Settings
                </a>
            </li>

        </ul>

        <div class="sidebar-footer">

            <div class="user-info">
                <div class="user-avatar" id="adminAvatar">A</div>

                <div>
                    <div class="user-name" id="adminName">Admin</div>
                    <div class="user-role" id="adminRole">Administrator</div>
                </div>
            </div>

            <button class="logout-btn" onclick="handleLogout()">
                <i class="fas fa-sign-out-alt"></i>
                Logout
            </button>

        </div>

    </aside>

    <!-- =========================================================
         MAIN CONTENT
         ========================================================= -->

    <main class="main-content">

        <div class="topbar">

            <div class="topbar-left">

                <button
                    class="sidebar-toggle"
                    id="sidebarToggle"
                    aria-label="Toggle menu"
                >
                    <i class="fas fa-bars"></i>
                </button>

                <h1>
                    Reports
                    <small>Export data as CSV for analysis</small>
                </h1>

            </div>

            <div class="actions">
                <span class="date-time" id="currentDateTime"></span>
            </div>

        </div>

        <!-- =====================================================
             REPORT GRID
             ===================================================== -->

        <div class="report-grid">

            <!-- =================================================
                 PAYMENTS REPORT
                 ================================================= -->

            <div class="card">

                <div class="card-header">
                    <i class="fas fa-credit-card payments-icon"></i>
                    <h3>Payments</h3>
                </div>

                <div class="filter-row">

                    <div class="filter-group">
                        <label>From</label>
                        <input type="date" id="paymentsFrom">
                    </div>

                    <div class="filter-group">
                        <label>To</label>
                        <input type="date" id="paymentsTo">
                    </div>

                </div>

                <div class="filter-group">

                    <label>Status</label>

                    <select id="paymentsStatus">

                        <option value="">All statuses</option>

                        <option value="SUCCESSFUL">
                            Successful
                        </option>

                        <option value="COMPLETED">
                            Completed
                        </option>

                        <option value="PENDING">
                            Pending
                        </option>

                        <option value="FAILED">
                            Failed
                        </option>

                        <option value="REVERSED">
                            Reversed
                        </option>

                        <option value="PARTIAL">
                            Partial
                        </option>

                    </select>

                </div>

                <button
                    class="btn btn-success btn-block"
                    onclick="exportPaymentsCsv()"
                    id="exportPaymentsBtn"
                >
                    <i class="fas fa-download"></i>
                    Export Payments CSV
                </button>

                <div
                    class="report-status"
                    id="paymentsStatusMsg"
                ></div>

            </div>

            <!-- =================================================
                 MEMBERS REPORT
                 ================================================= -->

            <div class="card">

                <div class="card-header">
                    <i class="fas fa-users members-icon"></i>
                    <h3>Members</h3>
                </div>

                <div class="filter-row">

                    <div class="filter-group">
                        <label>Registered From</label>
                        <input type="date" id="membersFrom">
                    </div>

                    <div class="filter-group">
                        <label>Registered To</label>
                        <input type="date" id="membersTo">
                    </div>

                </div>

                <div class="filter-group">

                    <label>Status</label>

                    <select id="membersStatus">

                        <option value="">All statuses</option>

                        <option value="ACTIVE">
                            Active
                        </option>

                        <option value="DORMANT">
                            Dormant
                        </option>

                        <option value="SUSPENDED">
                            Suspended
                        </option>

                        <option value="CANCELLED">
                            Cancelled
                        </option>

                        <option value="PENDING">
                            Pending
                        </option>

                    </select>

                </div>

                <div class="filter-group">

                    <label>Plan Type</label>

                    <select id="membersPlan">

                        <option value="">All Plans</option>

                        <option value="comfort">
                            Comfort
                        </option>

                        <option value="dignity">
                            Dignity
                        </option>

                        <option value="wazazi">
                            Wazazi
                        </option>

                        <option value="chama">
                            Chama
                        </option>

                    </select>

                </div>

                <button
                    class="btn btn-gold btn-block"
                    onclick="exportMembersCsv()"
                    id="exportMembersBtn"
                >
                    <i class="fas fa-download"></i>
                    Export Members CSV
                </button>

                <div
                    class="report-status"
                    id="membersStatusMsg"
                ></div>

            </div>

            <!-- =================================================
                 DEPENDANTS REPORT
                 ================================================= -->

            <div class="card">

                <div class="card-header">

/* =============================================================

function pickField(
    obj,
    candidates
) {

    if (!obj) {
        return '';
    }


    for (
        const key of candidates
    ) {

        if (
            obj[key] !== undefined &&
            obj[key] !== null &&
            obj[key] !== ''
        ) {

            return obj[key];
        }
    }


    return '';
}

/* =============================================================
   DATE HELPERS
   ============================================================= */

function formatDateOnly(value) {

    if (!value) {
        return '';
    }


    const d =
        new Date(value);


    if (
        isNaN(
            d.getTime()
        )
    ) {

        return String(value);
    }


    return d.toLocaleDateString(
        'en-KE'
    );
}


function formatDateTime(value) {

    if (!value) {
        return '';
    }


    const d =
        new Date(value);


    if (
        isNaN(
            d.getTime()
        )
    ) {

        return String(value);
    }


    return d.toLocaleString(
        'en-KE'
    );
}


/* =============================================================
   PAYMENT STATUS NORMALIZATION
   ============================================================= */

function normalizePaymentStatus(payment) {

    if (!payment) {
        return '';
    }


    const paymentStatus =
        String(
            payment.payment_status || ''
        ).trim().toUpperCase();


    const transactionStatus =
        String(
            payment.status || ''
        ).trim().toUpperCase();


    /*
     * Explicit failed/reversed states must remain failed/reversed.
     */

    if (
        paymentStatus === 'FAILED' ||
        transactionStatus === 'FAILED'
    ) {
        return 'FAILED';
    }


    if (
        paymentStatus === 'REVERSED' ||
        transactionStatus === 'REVERSED'
    ) {
        return 'REVERSED';
    }


    if (
        paymentStatus === 'PARTIAL' ||
        transactionStatus === 'PARTIAL'
    ) {
        return 'PARTIAL';
    }


    /*
     * Current successful records.
     */

    if (
        paymentStatus === 'SUCCESSFUL' ||
        transactionStatus === 'SUCCESSFUL'
    ) {
        return 'SUCCESSFUL';
    }


    /*
     * Legacy completed records.
     */

    if (
        transactionStatus === 'COMPLETED'
    ) {
        return 'COMPLETED';
    }


    if (
        paymentStatus === 'COMPLETED'
    ) {
        return 'COMPLETED';
    }


    /*
     * Pending.
     */

    if (
        paymentStatus === 'PENDING' ||
        transactionStatus === 'PENDING'
    ) {
        return 'PENDING';
    }


    return transactionStatus ||
        paymentStatus ||
        '';
}


/* =============================================================
   PAYMENT FILTER
   ============================================================= */

function paymentMatchesStatus(
    payment,
    selectedStatus
) {

    if (!selectedStatus) {
        return true;
    }


    return (
        normalizePaymentStatus(
            payment
        ) === selectedStatus
    );
}


/* =============================================================
   FETCH ALL ROWS
   Supabase default limits can otherwise truncate reports.
   ============================================================= */

async function fetchAllRows(
    queryBuilder,
    pageSize = 1000
) {

    const allRows = [];

    let from = 0;


    while (true) {

        const to =
            from + pageSize - 1;


        const {
            data,
            error
        } =
            await queryBuilder.range(
                from,
                to
            );


        if (error) {
            throw error;
        }


        const rows =
            Array.isArray(data)
                ? data
                : [];


        allRows.push(
            ...rows
        );


        if (
            rows.length < pageSize
        ) {
            break;
        }


        from += pageSize;
    }


    return allRows;
}

   ============================================================= */

window.exportPaymentsCsv =
    async function () {

        const btn =
            document.getElementById(
                'exportPaymentsBtn'
            );

        const statusMsg =
            document.getElementById(
                'paymentsStatusMsg'
            );


        setButtonLoading(
            btn,
            'Exporting...'
        );


        setStatus(
            statusMsg,
            'info',
            'Fetching payment data...'
        );


        try {

            const from =
                document.getElementById(
                    'paymentsFrom'
                ).value;


            const to =
                document.getElementById(
                    'paymentsTo'
                ).value;


            const selectedStatus =
                document.getElementById(
                    'paymentsStatus'
                ).value;


            /*
             * Fetch broadly and normalize status client-side.
             *
             * This is important because legacy payments may have:
             *
             * status = completed
             * payment_status = PENDING
             *
             * while current successful payments can have:
             *
             * status = SUCCESSFUL
             * payment_status = SUCCESSFUL
             */

            let query =
                supabaseClient
                    .from('payments')
                    .select(`
                        *,
                        members (
                            id,
                            member_number,
                            full_name,
                            first_name,
                            middle_name,
                            last_name,
                            phone
                        )
                    `);


            /*
             * Financial reporting should use payment_date.
             */

            if (from) {

                query =
                    query.gte(
                        'payment_date',
                        `${from}T00:00:00`
                    );
            }


            if (to) {

                query =
                    query.lte(
                        'payment_date',
                        `${to}T23:59:59`
                    );
            }


            query =
                query.order(
                    'payment_date',
                    {
                        ascending: false,
                        nullsFirst: false
                    }
                );


            const data =
                await fetchAllRows(
                    query
                );


            const filtered =
                data.filter(
                    payment =>
                        paymentMatchesStatus(
                            payment,
                            selectedStatus
                        )
                );


            if (
                filtered.length === 0
            ) {

                setStatus(
                    statusMsg,
                    'warning',
                    'No payments found for the selected filters.'
                );

                return;
            }


            const headers = [

                'Payment Date',

                'Payment ID',

                'Membership #',

                'Member Name',

                'Phone',

                'Amount',

                'Payment Type',

                'Effective Status',

                'Transaction Status',

                'Payment Status',

                'Counts Toward Membership',

                'Monthly Paid',

                'Payment Period Start',

                'Payment Period End',

                'M-Pesa Code',

                'M-Pesa Receipt',

                'Payment Reference',

                'Transaction ID',

                'Payment Method',

                'Created At'

            ];


            const rows =
                filtered.map(
                    p => {

                        const member =
                            p.members || {};


                        return [

                            formatDateTime(
                                p.payment_date
                            ),

                            p.id || '',

                            memberNumber(
                                member
                            ) ||
                            p.member_number ||
                            p.membership_number ||
                            '',

                            memberFullName(
                                member
                            ) ||
                            p.member_name ||
                            '',

                            member.phone ||
                            p.phone ||
                            '',

                            p.amount ?? 0,

                            p.payment_type ||
                            '',

                            normalizePaymentStatus(
                                p
                            ),

                            p.status ||
                            '',

                            p.payment_status ||
                            '',

                            p.counts_toward_membership === true
                                ? 'YES'
                                : p.counts_toward_membership === false
                                    ? 'NO'
                                    : '',

                            p.monthly_paid === true
                                ? 'YES'
                                : p.monthly_paid === false
                                    ? 'NO'
                                    : '',

                            formatDateOnly(
                                p.payment_period_start
                            ),

                            formatDateOnly(
                                p.payment_period_end
                            ),

                            p.mpesa_code ||
                            '',

                            p.mpesa_receipt ||
                            '',

                            p.payment_reference ||
                            p.reference ||
                            '',

                            p.transaction_id ||
                            '',

                            p.payment_method ||
                            '',

                            formatDateTime(
                                p.created_at
                            )

                        ];
                    }
                );


            downloadCSV(
                headers,
                rows,
                `payments_${todayFilename()}`
            );


            setStatus(
                statusMsg,
                'success',
                `✅ ${filtered.length} payments exported successfully.`
            );


            showToast(
                'success',
                `${filtered.length} payments exported`
            );


        } catch (error) {

            console.error(
                '❌ Export payments error:',
                error
            );


            setStatus(
                statusMsg,
                'error',
                `❌ Failed to export payments: ${friendlyError(error)}`
            );


            showToast(
                'error',
                'Failed to export payments'
            );

        } finally {

            resetButton(
                btn,
                '<i class="fas fa-download"></i> Export Payments CSV'
            );
        }
    };

/* =============================================================

window.exportMembersDependantsCsv =
    async function () {

        const btn =
            document.getElementById(
                'exportMembersDependantsBtn'
            );

        const statusMsg =
            document.getElementById(
                'membersDependantsStatusMsg'
            );


        setButtonLoading(
            btn,
            'Exporting...'
        );


        setStatus(
            statusMsg,
            'info',
            'Fetching members, dependants and Wazazi parents...'
        );


        try {

            const from =
                document.getElementById(
                    'mdFrom'
                ).value;


            const to =
                document.getElementById(
                    'mdTo'
                ).value;


            const status =
                document.getElementById(
                    'mdStatus'
                ).value;


            const plan =
                document.getElementById(
                    'mdPlan'
                ).value;


            /*
             * We request the member and dependant relationship.
             *
             * Wazazi parents are separately extracted from
             * parent_1_* ... parent_4_* fields on members.
             */

            let query =
                supabaseClient
                    .from('members')
                    .select(`
                        *,
                        dependants (*)
                    `);


            if (from) {

                query =
                    query.gte(
                        'created_at',
                        `${from}T00:00:00`
                    );
            }


            if (to) {

                query =
                    query.lte(
                        'created_at',
                        `${to}T23:59:59`
                    );
            }


            if (status) {

                query =
                    query.eq(
                        'status',
                        status
                    );
            }


            if (plan) {

                query =
                    query.eq(
                        'plan_type',
                        plan
                    );
            }


            query =
                query.order(
                    'created_at',
                    {
                        ascending: false
                    }
                );


            const members =
                await fetchAllRows(
                    query
                );


            if (
                members.length === 0
            ) {

                setStatus(
                    statusMsg,
                    'warning',
                    'No members found for the selected filters.'
                );

                return;
            }


            const headers = [

                'Person Type',

                'Date Joined',

                'Membership #',

                'Principal Member',

                'Principal Phone',

                'Principal ID Number',

                'Principal Date of Birth',

                'Plan',

                'Member Status',

                'Covered Person Name',

                'Relationship',

                'Covered Person Phone',

                'Covered Person Date of Birth',

                'Covered Person ID Number',

                'Created At'

            ];


            const rows = [];


            members.forEach(
                member => {

                    const dateJoined =
                        formatDateOnly(
                            member.created_at
                        );


                    const membershipNo =
                        memberNumber(
                            member
                        );


                    const principalName =
                        memberFullName(
                            member
                        );


                    const principalPhone =
                        member.phone ||
                        '';


                    const principalId =
                        memberIdNumber(
                            member
                        );


                    const principalDob =
                        formatDateOnly(
                            memberDob(
                                member
                            )
                        );


                    const planName =
                        member.plan_type ||
                        member.plan ||
                        '';


                    const memberStatus =
                        member.status ||
                        member.member_status ||
                        '';


                    /*
                     * Always export the principal.
                     */

                    rows.push([

                        'PRINCIPAL',

                        dateJoined,

                        membershipNo,

                        principalName,

                        principalPhone,

                        principalId,

                        principalDob,

                        planName,

                        memberStatus,

                        principalName,

                        'PRINCIPAL',

                        principalPhone,

                        principalDob,

                        principalId,

                        formatDateTime(
                            member.created_at
                        )

                    ]);


                    /*
                     * Normal dependants.
                     */

                    const dependants =
                        Array.isArray(
                            member.dependants
                        )
                            ? member.dependants
                            : [];


                    dependants.forEach(
                        dependant => {

                            rows.push([

                                'DEPENDANT',

                                dateJoined,

                                membershipNo,

                                principalName,

                                principalPhone,

                                principalId,

                                principalDob,

                                planName,

                                memberStatus,

                                dependantFullName(
                                    dependant
                                ),

                                dependant.relationship ||
                                '',

                                dependant.phone ||
                                '',

                                formatDateOnly(
                                    dependantDob(
                                        dependant
                                    )
                                ),

                                dependantIdNumber(
                                    dependant
                                ),

                                formatDateTime(
                                    dependant.created_at
                                )

                            ]);
                        }
                    );


                    /*
                     * WAZAZI PARENTS.
                     *
                     * Parents live directly on the members table.
                     */

                    if (
                        String(
                            member.plan_type ||
                            member.plan ||
                            ''
                        ).toLowerCase() === 'wazazi'
                    ) {

                        for (
                            let i = 1;
                            i <= 4;
                            i++
                        ) {

                            const parentName =
                                pickField(
                                    member,
                                    [
                                        `parent_${i}_name`
                                    ]
                                );


                            if (
                                !parentName
                            ) {
                                continue;
                            }


                            const parentDob =
                                pickField(
                                    member,
                                    [
                                        `parent_${i}_dob`
                                    ]
                                );


                            const parentPhone =
                                pickField(
                                    member,
                                    [
                                        `parent_${i}_phone`
                                    ]
                                );


                            const parentId =
                                pickField(
                                    member,
                                    [
                                        `parent_${i}_id`
                                    ]
                                );


                            rows.push([

                                'PARENT',

                                dateJoined,

                                membershipNo,

                                principalName,

                                principalPhone,

                                principalId,

                                principalDob,

                                planName,

                                memberStatus,

                                parentName,

                                'PARENT',

                                parentPhone,

                                formatDateOnly(
                                    parentDob
                                ),

                                parentId,

                                formatDateTime(
                                    member.created_at
                                )

                            ]);
                        }
                    }

                }
            );


            downloadCSV(
                headers,
                rows,
                `members_covered_persons_${todayFilename()}`
            );


            setStatus(
                statusMsg,
                'success',
                `✅ ${members.length} members and ${rows.length} covered-person rows exported successfully.`
            );


            showToast(
                'success',
                `${rows.length} covered-person rows exported`
            );


        } catch (error) {

            console.error(
                '❌ Combined export error:',
                error
            );


            setStatus(
                statusMsg,
                'error',
                `❌ Failed to export combined report: ${friendlyError(error)}`
            );


            showToast(
                'error',
                'Failed to export combined report'
            );

        } finally {

            resetButton(
                btn,
                '<i class="fas fa-download"></i> Export Members & Dependants CSV'
            );
        }
    };


/* =============================================================
   CSV DOWNLOAD
   ============================================================= */

function downloadCSV(
    headers,
    rows,
    filename
) {

    /*
     * UTF-8 BOM makes Excel correctly recognize
     * names and other Unicode text.
     */

    const csvRows = [];


    csvRows.push(
        headers.map(
            csvEscape
        ).join(',')
    );


    rows.forEach(
        row => {

            csvRows.push(
                row
                    .map(
                        csvEscape
                    )
                    .join(',')
            );
        }
    );


    const csv =
        '\uFEFF' +
        csvRows.join('\r\n');


    const blob =
        new Blob(
            [csv],
            {
                type:
                    'text/csv;charset=utf-8;'
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            'a'
        );


    a.href = url;

    a.download =
        `${filename}.csv`;


    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);


    setTimeout(
        () => URL.revokeObjectURL(url),
        100
    );
}


function csvEscape(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return '""';
    }


    const text =
        String(value);


    return `"${text.replace(
        /"/g,
        '""'
    )}"`;
}


/* =============================================================
   UI HELPERS
   ============================================================= */

function setButtonLoading(
    btn,
    text
) {

    if (!btn) {
        return;
    }


    btn.disabled = true;


    btn.innerHTML =
        `<i class="fas fa-spinner fa-spin"></i> ${text}`;
}


function resetButton(
    btn,
    html
) {

    if (!btn) {
        return;
    }


    btn.disabled = false;

    btn.innerHTML = html;
}


function setStatus(
    element,
    type,
    message
) {

    if (!element) {
        return;
    }


    element.className =
        `report-status ${type}`;


    element.textContent =
        message;
}


function numberOrZero(value) {

    const n =
        Number(value);


    return Number.isFinite(n)
        ? n
        : 0;
}


function todayFilename() {

    return new Date()
        .toISOString()
        .split('T')[0];
}


function friendlyError(error) {

    if (!error) {
        return 'Unknown error';
    }


    return (
        error.message ||
        error.details ||
        error.hint ||
        String(error)
    );
}


/* =============================================================
   SIDEBAR TOGGLE
   ============================================================= */

function setupSidebarToggle() {

    const sidebar =
        document.getElementById(
            'sidebar'
        );


    const backdrop =
        document.getElementById(
            'sidebarBackdrop'
        );


    const toggleBtn =
        document.getElementById(
            'sidebarToggle'
        );


    if (toggleBtn) {

        toggleBtn.addEventListener(
            'click',
            function () {

                sidebar.classList.toggle(
                    'open'
                );

                backdrop.classList.toggle(
                    'show'
                );
            }
        );
    }


    if (backdrop) {

        backdrop.addEventListener(
            'click',
            function () {

                sidebar.classList.remove(
                    'open'
                );

                backdrop.classList.remove(
                    'show'
                );
            }
        );
    }


    document
        .querySelectorAll(
            '.sidebar-nav a'
        )
        .forEach(
            function (link) {

                link.addEventListener(
                    'click',
                    function () {

                        sidebar.classList.remove(
                            'open'
                        );

                        backdrop.classList.remove(
                            'show'
                        );
                    }
                );
            }
        );
}


/* =============================================================
   CLOCK
   ============================================================= */

function updateClock() {

    const clockEl =
        document.getElementById(
            'currentDateTime'
        );


    if (clockEl) {

        const now =
            new Date();


        clockEl.textContent =
            now.toLocaleString(
                'en-KE',
                {
                    weekday: 'short',
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }
            );
    }


    setTimeout(
        updateClock,
        30000
    );
}


/* =============================================================
   TOAST
   ============================================================= */

function showToast(
    type,
    message
) {

    const container =
        document.getElementById(
            'toastContainer'
        );


    if (!container) {
        return;
    }


    const icons = {

        success:
            'fa-check-circle',

        error:
            'fa-exclamation-circle',

        warning:
            'fa-triangle-exclamation',

        info:
            'fa-info-circle'

    };


    const toast =
        document.createElement(
            'div'
        );


    toast.className =
        `toast ${type}`;


    const icon =
        icons[type] ||
        icons.info;


    /*
     * Do not insert unescaped user/database
     * content into innerHTML.
     */

    const iconEl =
        document.createElement(
            'i'
        );

    iconEl.className =
        `fas ${icon}`;


    const span =
        document.createElement(
            'span'
        );

    span.textContent =
        message;


    const closeBtn =
        document.createElement(
            'button'
        );

    closeBtn.className =
        'toast-close';

    closeBtn.innerHTML =
        '&times;';


    closeBtn.addEventListener(
        'click',
        function (event) {

            event.stopPropagation();

            toast.remove();
        }
    );


    toast.appendChild(
        iconEl
    );

    toast.appendChild(
        span
    );

    toast.appendChild(
        closeBtn
    );


    container.appendChild(
        toast
    );


    setTimeout(
        () => {

            toast.style.opacity =
                '0';

            toast.style.transform =
                'translateX(100px)';

            toast.style.transition =
                'all 0.4s ease';


            setTimeout(
                () => toast.remove(),
                400
            );

        },
        4000
    );
}
