<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    'https://wpxzlcdrirlcyvfiquld.supabase.co';

const SUPABASE_ANON_KEY =
    'YOUR_SUPABASE_ANON_KEY';

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   STATUS / TOAST
========================================================= */

function showStatus(message, type = 'info') {
    const el = document.getElementById('statusMessage');

    el.textContent = message;
    el.className = 'status ' + type;

    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}

function clearStatus() {
    const el = document.getElementById('statusMessage');

    el.textContent = '';
    el.className = 'status';
}


/* =========================================================
   FIELD HELPERS
========================================================= */

function pickField(obj, fields) {
    if (!obj) return '';

    for (const field of fields) {
        if (
            obj[field] !== undefined &&
            obj[field] !== null &&
            String(obj[field]).trim() !== ''
        ) {
            return obj[field];
        }
    }

    return '';
}


/* =========================================================
   MEMBER NUMBER
   IMPORTANT:
   PRIMARY DATABASE FIELD = member_number
   OLD FIELD = membership_number
========================================================= */

function memberNumber(member) {
    return pickField(member, [
        'member_number',
        'membership_number'
    ]);
}


/* =========================================================
   MEMBER NAME
   PRIMARY DATABASE FIELD = full_name
========================================================= */

function memberName(member) {

    const fullName = pickField(member, [
        'full_name'
    ]);

    if (fullName) {
        return fullName;
    }

    const firstName = pickField(member, [
        'first_name',
        'firstname'
    ]);

    const lastName = pickField(member, [
        'last_name',
        'lastname'
    ]);

    return [firstName, lastName]
        .filter(Boolean)
        .join(' ')
        .trim();
}


/* =========================================================
   MEMBER ID
========================================================= */

function memberIdNumber(member) {
    return pickField(member, [
        'national_id',
        'id_number',
        'national_id_number',
        'id_no',
        'nid',
        'identification_number'
    ]);
}


/* =========================================================
   MEMBER DOB
========================================================= */

function memberDob(member) {
    return pickField(member, [
        'date_of_birth',
        'dob',
        'birth_date'
    ]);
}


/* =========================================================
   MEMBER PHONE
========================================================= */

function memberPhone(member) {
    return pickField(member, [
        'phone',
        'phone_number',
        'mobile',
        'mobile_number'
    ]);
}


/* =========================================================
   DEPENDANT NAME
========================================================= */

function dependantName(dependant) {

    const fullName = pickField(dependant, [
        'full_name'
    ]);

    if (fullName) {
        return fullName;
    }

    const firstName = pickField(dependant, [
        'first_name',
        'firstname'
    ]);

    const lastName = pickField(dependant, [
        'last_name',
        'lastname'
    ]);

    return [firstName, lastName]
        .filter(Boolean)
        .join(' ')
        .trim();
}


/* =========================================================
   DEPENDANT DOB
========================================================= */

function dependantDob(dependant) {
    return pickField(dependant, [
        'date_of_birth',
        'dob',
        'birth_date'
    ]);
}


/* =========================================================
   DEPENDANT ID
========================================================= */

function dependantIdNumber(dependant) {
    return pickField(dependant, [
        'national_id',
        'id_number',
        'national_id_number',
        'id_no',
        'nid',
        'identification_number'
    ]);
}


/* =========================================================
   DEPENDANT PHONE
========================================================= */

function dependantPhone(dependant) {
    return pickField(dependant, [
        'phone',
        'phone_number',
        'mobile',
        'mobile_number'
    ]);
}


/* =========================================================
   DEPENDANT RELATIONSHIP
========================================================= */

function dependantRelationship(dependant) {
    return pickField(dependant, [
        'relationship',
        'relation',
        'relationship_type'
    ]);
}


/* =========================================================
   DATE FORMAT
========================================================= */

function formatDateOnly(value) {

    if (!value) return '';

    const text = String(value);

    if (text.length >= 10) {
        return text.substring(0, 10);
    }

    return text;
}


/* =========================================================
   CSV ESCAPE
========================================================= */

function csvEscape(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return '';
    }

    const text = String(value);

    if (
        text.includes('"') ||
        text.includes(',') ||
        text.includes('\n') ||
        text.includes('\r')
    ) {
        return '"' +
            text.replace(/"/g, '""') +
            '"';
    }

    return text;
}


/* =========================================================
   CSV DOWNLOAD
========================================================= */

function downloadCsv(filename, headers, rows) {

    const csv = [
        headers.map(csvEscape).join(','),
        ...rows.map(row =>
            row.map(csvEscape).join(',')
        )
    ].join('\r\n');

    const blob = new Blob(
        ['\uFEFF' + csv],
        {
            type: 'text/csv;charset=utf-8;'
        }
    );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement('a');

    link.href = url;
    link.download = filename;

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);
}


/* =========================================================
   DATE RANGE HELPER
========================================================= */

function applyDateRange(
    query,
    fromId,
    toId,
    column = 'created_at'
) {

    const from =
        document.getElementById(fromId).value;

    const to =
        document.getElementById(toId).value;

    if (from) {
        query = query.gte(
            column,
            from + 'T00:00:00'
        );
    }

    if (to) {
        query = query.lte(
            column,
            to + 'T23:59:59'
        );
    }

    return query;
}


/* =========================================================
   DEFAULT DATES
========================================================= */

function getLocalDateString(date = new Date()) {

    const year = date.getFullYear();

    const month =
        String(date.getMonth() + 1)
            .padStart(2, '0');

    const day =
        String(date.getDate())
            .padStart(2, '0');

    return `${year}-${month}-${day}`;
}


function setDefaultDates() {

    const today =
        getLocalDateString();

    const date = new Date();

    date.setDate(date.getDate() - 30);

    const thirtyDaysAgo =
        getLocalDateString(date);

    const fields = [
        ['paymentFrom', thirtyDaysAgo],
        ['paymentTo', today],

        ['memberFrom', thirtyDaysAgo],
        ['memberTo', today],

        ['dependantFrom', thirtyDaysAgo],
        ['dependantTo', today],

        ['combinedFrom', thirtyDaysAgo],
        ['combinedTo', today]
    ];

    fields.forEach(([id, value]) => {

        const element =
            document.getElementById(id);

        if (element) {
            element.value = value;
        }
    });
}


/* =========================================================
   AUTHENTICATION
========================================================= */

async function checkAuth() {

    const {
        data: sessionData,
        error: sessionError
    } = await supabaseClient.auth.getSession();

    if (sessionError) {
        throw sessionError;
    }

    const session =
        sessionData?.session;

    if (!session) {
        window.location.href = 'admin-login.html';
        return false;
    }

    const user =
        session.user;

    let staffRecord = null;

    const {
        data: staffData,
        error: staffError
    } = await supabaseClient
        .from('staff')
        .select('*')
        .eq('id', user.id)
        .maybeSingle();

    if (!staffError && staffData) {
        staffRecord = staffData;
    }


    /* -----------------------------------------
       FALLBACK TO ADMINS TABLE
    ----------------------------------------- */

    if (!staffRecord) {

        const {
            data: adminData,
            error: adminError
        } = await supabaseClient
            .from('admins')
            .select('*')
            .eq('id', user.id)
            .maybeSingle();

        if (!adminError && adminData) {
            staffRecord = adminData;
        }
    }


    if (!staffRecord) {

        showStatus(
            'You are authenticated but do not have admin access.',
            'error'
        );

        await supabaseClient.auth.signOut();

        setTimeout(() => {
            window.location.href = 'admin-login.html';
        }, 1500);

        return false;
    }


    const role = String(
        pickField(staffRecord, [
            'role',
            'user_role',
            'staff_role'
        ])
    ).toUpperCase();


    if (
        role !== 'SUPER_ADMIN' &&
        role !== 'ADMIN'
    ) {

        showStatus(
            'Admin access is required to view reports.',
            'error'
        );

        await supabaseClient.auth.signOut();

        setTimeout(() => {
            window.location.href = 'admin-login.html';
        }, 1500);

        return false;
    }


    const displayName =
        pickField(staffRecord, [
            'full_name',
            'name',
            'email'
        ]) || user.email || 'Administrator';

    document.getElementById(
        'adminUserInfo'
    ).textContent =
        `${displayName} · ${role}`;

    return true;
}


/* =========================================================
   PAYMENTS REPORT
========================================================= */

async function exportPaymentsCsv() {

    clearStatus();

    const button =
        event?.currentTarget;

    if (button) {
        button.disabled = true;
    }

    try {

        showStatus(
            'Preparing payments report...',
            'info'
        );

        let query =
            supabaseClient
                .from('payments')
                .select('*')
                .order('created_at', {
                    ascending: true
                });


        query = applyDateRange(
            query,
            'paymentFrom',
            'paymentTo',
            'created_at'
        );


        const status =
            document.getElementById(
                'paymentStatus'
            ).value;


        if (status) {
            query = query.eq(
                'status',
                status
            );
        }


        const {
            data,
            error
        } = await query;


        if (error) {
            throw error;
        }


        if (!data || data.length === 0) {

            showStatus(
                'No payments found for the selected filters.',
                'info'
            );

            return;
        }


        const headers = [
            'Date',
            'Membership #',
            'Member Name',
            'Phone',
            'Amount',
            'Status',
            'Payment Reference',
            'Transaction ID',
            'Month',
            'Payment Method'
        ];


        const rows = data.map(p => {

            const member =
                p.members || {};

            const memberNumberValue =
                memberNumber(p) ||
                memberNumber(member);

            const name =
                pickField(p, [
                    'member_name',
                    'full_name',
                    'name'
                ]) ||
                memberName(member);

            const phone =
                memberPhone(p) ||
                memberPhone(member);

            const amount =
                pickField(p, [
                    'amount',
                    'paid_amount',
                    'payment_amount'
                ]);

            const statusValue =
                pickField(p, [
                    'status',
                    'payment_status'
                ]);

            const reference =
                pickField(p, [
                    'payment_reference',
                    'reference',
                    'invoice_number',
                    'invoice',
                    'mpesa_receipt',
                    'receipt_number'
                ]);

            const transaction =
                pickField(p, [
                    'transaction_id',
                    'transaction_code',
                    'checkout_request_id',
                    'merchant_request_id'
                ]);

            const month =
                pickField(p, [
                    'month',
                    'payment_month',
                    'paid_for_month'
                ]);

            const method =
                pickField(p, [
                    'payment_method',
                    'method',
                    'channel'
                ]);

            return [
                formatDateOnly(
                    p.created_at
                ),
                memberNumberValue,
                name,
                phone,
                amount,
                statusValue,
                reference,
                transaction,
                month,
                method
            ];
        });


        downloadCsv(
            `masika-payments-${getLocalDateString()}.csv`,
            headers,
            rows
        );


        showStatus(
            `${rows.length} payment record(s) exported successfully.`,
            'success'
        );

    } catch (error) {

        console.error(
            'Payments export error:',
            error
        );

        showStatus(
            'Failed to export payments: ' +
            (error.message || error),
            'error'
        );

    } finally {

        if (button) {
            button.disabled = false;
        }
    }
}

    clearStatus();

    const button =

    if (button) {
        button.disabled = true;
    }

    try {

        showStatus(
            'Preparing members report...',
            'info'

        let query =
            supabaseClient
                .from('members')
                .select('*')
                .order('created_at', {
                    ascending: true
                });


        query = applyDateRange(
            query,
            'memberFrom',
            'memberTo',
            'created_at'
        );


        const status =
            document.getElementById(
                'memberStatus'
            ).value;


        if (status) {
            query = query.eq(
                'status',
                status
            );
        }


        const plan =
            document.getElementById(
                'memberPlan'
            ).value;


        if (plan) {

            query = query.eq(
                'plan_type',
                plan
            );
        }


        const {
            data,
            error
        } = await query;


        if (error) {
            throw error;
        }


        if (!data || data.length === 0) {

            showStatus(
                'No members found for the selected filters.',
                'info'
            );

            return;
        }


        const headers = [
            'Date Joined',
            'Membership #',
            'Full Name',
            'Phone',
            'National ID',
            'Date of Birth',
            'Plan',
            'Status',
            'Registration Fee',
            'Created At'
        ];


        const rows = data.map(m => {

            const registrationFee =
                pickField(m, [
                    'registration_fee',
                    'registration_amount'
                ]);

            return [
                formatDateOnly(
                    m.created_at
                ),

                memberNumber(m),

                memberName(m),

                memberPhone(m),

                memberIdNumber(m),

                formatDateOnly(
                    memberDob(m)
                ),

                pickField(m, [
                    'plan_type',
                    'plan'
                ]),

                pickField(m, [
                    'status',
                    'membership_status'
                ]),

                registrationFee,

                formatDateOnly(
                    m.created_at
                )
            ];
        });


        downloadCsv(
            `masika-members-${getLocalDateString()}.csv`,
            headers,
            rows
        );


        showStatus(

/* =========================================================
   DEPENDANTS REPORT
========================================================= */

async function exportDependantsCsv() {

    clearStatus();

    const button =
        event?.currentTarget;

    if (button) {
        button.disabled = true;
    }

    try {

        showStatus(
            'Preparing dependants report...',
            'info'
        );


        /*
         * We request the dependant records together
         * with their member where the FK relationship
         * is available.
         */
        let query =
            supabaseClient
                .from('dependants')
                .select(`
                    *,
                    members (
                        member_number,
                        membership_number,
                        full_name,
                        first_name,
                        last_name,
                        phone
                    )
                `)
                .order('created_at', {
                    ascending: true
                });


        query = applyDateRange(
            query,
            'dependantFrom',
            'dependantTo',
            'created_at'
        );


        const relationship =
            document.getElementById(
                'dependantRelationship'
            ).value;


        if (relationship) {

            query = query.eq(
                'relationship',
                relationship
            );
        }


        const {
            data,
            error
        } = await query;


        if (error) {
            throw error;
        }


        if (!data || data.length === 0) {

            showStatus(
                'No dependants found for the selected filters.',
                'info'
            );

            return;
        }


        const headers = [
            'Date Added',
            'Membership #',
            'Principal Member Name',
            'Principal Phone',
            'Dependant Name',
            'Relationship',
            'Dependant Phone',
            'Dependant Date of Birth',
            'Dependant ID Number'
        ];


        const rows = data.map(d => {

            const member =
                d.members || {};

            return [
                formatDateOnly(
                    d.created_at
                ),

                memberNumber(member),

                memberName(member),

                memberPhone(member),

                dependantName(d),

                dependantRelationship(d),

                dependantPhone(d),

                formatDateOnly(
                    dependantDob(d)
                ),

                dependantIdNumber(d)
            ];
        });


        downloadCsv(
            `masika-dependants-${getLocalDateString()}.csv`,
            headers,
            rows
        );


        showStatus(
            `${rows.length} dependant record(s) exported successfully.`,
            'success'
        );

    } catch (error) {

        console.error(
            'Dependants export error:',
            error
        );

        showStatus(
            'Failed to export dependants: ' +
            (error.message || error),
            'error'
        );

    } finally {

        if (button) {
            button.disabled = false;
        }
    }
}


/* =========================================================
   MEMBERS + DEPENDANTS REPORT
========================================================= */

async function exportMembersDependantsCsv() {

    clearStatus();

    const button =
        event?.currentTarget;

    if (button) {
        button.disabled = true;
    }

    try {

        showStatus(
            'Preparing members and dependants report...',
            'info'
        );


        let query =
            supabaseClient
                .from('members')
                .select(`
                    *,
                    dependants (*)
                `)
                .order('created_at', {
                    ascending: true
                });


        query = applyDateRange(
            query,
            'combinedFrom',
            'combinedTo',
            'created_at'
        );


        const status =
            document.getElementById(
                'combinedStatus'
            ).value;


        if (status) {

            query = query.eq(
                'status',
                status
            );
        }


        const plan =
            document.getElementById(
                'combinedPlan'
            ).value;


        if (plan) {

            query = query.eq(
                'plan_type',
                plan
            );
        }


        const {
            data,
            error
        } = await query;


        if (error) {
            throw error;
        }


        if (!data || data.length === 0) {

            showStatus(
                'No members or dependants found for the selected filters.',
                'info'
            );

            return;
        }


        const headers = [
            'Date Joined',
            'Membership #',
            'Principal Member Name',
            'Principal ID Number',
            'Principal Date of Birth',
            'Principal Phone',
            'Plan',
            'Member Status',
            'Dependant Name',
            'Relationship',
            'Dependant Date of Birth',
            'Dependant ID Number',
            'Dependant Phone'
        ];


        const rows = [];


        data.forEach(member => {

            const dependants =
                Array.isArray(member.dependants)
                    ? member.dependants
                    : [];


            /*
             * If there are no dependants,
             * still export the principal member.
             */
            if (dependants.length === 0) {

                rows.push([

                    formatDateOnly(
                        member.created_at
                    ),

                    memberNumber(member),

                    memberName(member),

                    memberIdNumber(member),

                    formatDateOnly(
                        memberDob(member)
                    ),

                    memberPhone(member),

                    pickField(member, [
                        'plan_type',
                        'plan'
                    ]),

                    pickField(member, [
                        'status',
                        'membership_status'
                    ]),

                    '',

                    '',

                    '',

                    '',

                    ''
                ]);

                return;
            }


            dependants.forEach(dependant => {

                rows.push([

                    formatDateOnly(
                        member.created_at
                    ),

                    memberNumber(member),

                    memberName(member),

                    memberIdNumber(member),

                    formatDateOnly(
                        memberDob(member)
                    ),

                    memberPhone(member),

                    pickField(member, [
                        'plan_type',
                        'plan'
                    ]),

                    pickField(member, [
                        'status',
                        'membership_status'
                    ]),

                    dependantName(dependant),

                    dependantRelationship(
                        dependant
                    ),

                    formatDateOnly(
                        dependantDob(dependant)
                    ),

                    dependantIdNumber(
                        dependant
                    ),

                    dependantPhone(
                        dependant
                    )
                ]);
            });

        });


        downloadCsv(
            `masika-members-dependants-${getLocalDateString()}.csv`,
            headers,
            rows
        );


        showStatus(
            `${rows.length} report row(s) exported successfully.`,
            'success'
        );

    } catch (error) {

        console.error(
            'Combined export error:',
            error
        );

        showStatus(
            'Failed to export combined report: ' +
            (error.message || error),
            'error'
        );

    } finally {

        if (button) {
            button.disabled = false;
        }
    }
}
