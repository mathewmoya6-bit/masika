<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | Masika Benevolent</title>
    <link rel="icon" type="image/png" href="../assets/favicon-32x32.png">

    <!-- =========================================================
         SUPABASE & EXTERNAL JS
         ========================================================= -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
           REPORTS STYLES
           ============================================================ */

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #0b5d3b;
            --primary-dark: #06452c;
            --primary-light: #e8f5ee;
            --gold: #d4a843;
            --gold-light: #f5e6b8;
            --danger: #dc3545;
            --danger-light: #fce4e8;
            --success: #198754;
            --success-light: #d4edda;
            --warning: #ffc107;
            --warning-light: #fff3cd;
            --info: #0dcaf0;
            --info-light: #d1f0f9;
            --text: #1f2933;
            --text-light: #6b7280;
            --text-lighter: #9ca3af;
            --white: #ffffff;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --shadow-hover: 0 4px 24px rgba(0,0,0,0.12);
            --radius: 12px;
            --radius-lg: 16px;
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #f0f4f2;
            color: var(--text);
            min-height: 100vh;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--gray-100); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gray-400); }

        .admin-layout { display: flex; min-height: 100vh; }

        /* ============================================================
           SIDEBAR
           ============================================================ */

        .sidebar {
            width: 280px;
            background: var(--primary);
            color: white;
            padding: 24px 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            transition: var(--transition);
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .sidebar-brand {
            padding: 0 24px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .sidebar-brand .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }

        .sidebar-brand .logo-icon {
            width: 44px;
            height: 44px;
            background: var(--gold);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: var(--white);
            font-size: 20px;
        }

        .sidebar-brand .logo-text {
            font-weight: 800;
            font-size: 20px;
            letter-spacing: -0.5px;
        }

        .sidebar-brand .logo-sub {
            font-size: 11px;
            opacity: 0.6;
            display: block;
            font-weight: 400;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .sidebar-nav {
            list-style: none;
            padding: 0 12px;
            flex: 1;
        }

        .sidebar-nav li { margin-bottom: 2px; }

        .sidebar-nav .nav-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: rgba(255,255,255,0.3);
            padding: 12px 16px 6px;
            font-weight: 700;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 16px;
            border-radius: 10px;
            color: rgba(255,255,255,0.65);
            text-decoration: none;
            transition: var(--transition);
            font-size: 14px;
            font-weight: 500;
            position: relative;
        }

        .sidebar-nav a:hover {
            background: rgba(255,255,255,0.08);
            color: white;
        }

        .sidebar-nav a.active {
            background: rgba(255,255,255,0.12);
            color: white;
        }

        .sidebar-nav a.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 20%;
            height: 60%;
            width: 3px;
            background: var(--gold);
            border-radius: 0 3px 3px 0;
        }

        .sidebar-nav a i {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        .sidebar-nav .badge {
            margin-left: auto;
            background: var(--gold);
            color: white;
            padding: 1px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            min-width: 20px;
            text-align: center;
        }

        .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid rgba(255,255,255,0.08);
            margin-top: auto;
            flex-shrink: 0;
        }

        .sidebar-footer .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-footer .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: white;
            flex-shrink: 0;
        }

        .sidebar-footer .user-name {
            font-weight: 600;
            font-size: 14px;
        }

        .sidebar-footer .user-role {
            font-size: 12px;
            opacity: 0.5;
        }

        .sidebar-footer .logout-btn {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            background: transparent;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
        }

        .sidebar-footer .logout-btn:hover {
            background: rgba(255,255,255,0.08);
            color: white;
            border-color: rgba(255,255,255,0.3);
        }

        /* ============================================================
           SIDEBAR BACKDROP
           ============================================================ */

        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 99;
        }

        .sidebar-backdrop.show { display: block; }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */

        .main-content {
            margin-left: 280px;
            padding: 24px 32px 40px;
            flex: 1;
            width: calc(100% - 280px);
            min-height: 100vh;
        }

        /* ============================================================
           TOPBAR
           ============================================================ */

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .topbar h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .topbar h1 small {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-light);
            display: block;
            margin-top: 2px;
        }

        .topbar .actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .topbar .actions .date-time {
            font-size: 14px;
            color: var(--text-light);
            font-weight: 500;
        }

        /* ============================================================
           BUTTONS
           ============================================================ */

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(11, 93, 59, 0.3);
        }

        .btn-gold {
            background: var(--gold);
            color: white;
        }
        .btn-gold:hover {
            background: #c49a3a;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(212, 168, 67, 0.3);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }
        .btn-success:hover {
            background: #157347;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(25, 135, 84, 0.3);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }
        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(220, 53, 69, 0.3);
        }

        .btn-info {
            background: var(--info);
            color: white;
        }
        .btn-info:hover {
            background: #0bb5d8;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(13, 202, 240, 0.3);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--gray-200);
            color: var(--text-light);
        }
        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 6px;
        }

        .btn-block { width: 100%; justify-content: center; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }

        /* ============================================================
           REPORT GRID
           ============================================================ */

        .report-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 24px;
        }

        /* ============================================================
           CARDS
           ============================================================ */

        .card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--gray-200);
        }

        .card-header h3 {
            font-size: 17px;
            font-weight: 700;
        }

        .card-header i {
            font-size: 20px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .card-header i.payments-icon { background: var(--success); }
        .card-header i.members-icon { background: var(--gold); }
        .card-header i.dependants-icon { background: var(--info); }

        /* ============================================================
           FILTERS
           ============================================================ */

        .filter-group {
            margin-bottom: 14px;
        }

        .filter-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-light);
        }

        .filter-group input,
        .filter-group select {
            width: 100%;
            padding: 9px 12px;
            border: 2px solid var(--gray-200);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            transition: var(--transition);
            background: white;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(11, 93, 59, 0.1);
        }

        .filter-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* ============================================================
           STATUS MESSAGE
           ============================================================ */

        .report-status {
            font-size: 13px;
            margin-top: 10px;
            min-height: 20px;
            padding: 8px 12px;
            border-radius: 6px;
        }

        .report-status.error {
            color: var(--danger);
            background: var(--danger-light);
        }

        .report-status.success {
            color: var(--success);
            background: var(--success-light);
        }

        .report-status.info {
            color: #055160;
            background: var(--info-light);
        }

        .report-status.warning {
            color: #856404;
            background: var(--warning-light);
        }

        /* ============================================================
           TOAST NOTIFICATIONS
           ============================================================ */

        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 420px;
        }

        .toast {
            padding: 14px 20px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            animation: slideIn 0.4s ease;
            box-shadow: 0 12px 48px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toast:hover { transform: scale(1.02); }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.info { background: var(--info); color: var(--text); }
        .toast.warning { background: var(--warning); color: var(--text); }

        .toast .toast-close {
            background: none;
            border: none;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            font-size: 18px;
            margin-left: auto;
            padding: 0 4px;
        }

        .toast .toast-close:hover { color: white; }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */

        .sidebar-toggle {
            display: none;
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition);
        }

        .sidebar-toggle:hover { background: var(--primary-dark); }

        @media (max-width: 1024px) {
            .report-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                width: 280px;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
                width: 100%;
                padding: 16px;
            }

            .sidebar-toggle {
                display: block;
            }

            .topbar .actions .date-time {
                display: none;
            }

            .topbar h1 {
                font-size: 22px;
            }

            .report-grid {
                grid-template-columns: 1fr;
            }

            .filter-row {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .topbar {
                flex-direction: column;
                align-items: stretch;
            }

            .topbar .actions {
                justify-content: flex-start;
            }
        }
    </style>
</head>

        // ============================================================
        // AUTH CHECK - Using Staff Table
        // ============================================================

        async function checkAuth() {
            console.log('🔐 Checking authentication...');

            try {
                const { data: { session }, error } = await supabaseClient.auth.getSession();

                if (error) {
                    console.error('❌ Session error:', error);
                    window.location.href = 'admin-login.html';
                    return false;
                }

                if (!session) {
                    console.log('⚠️ No session found');
                    window.location.href = 'admin-login.html';
                    return false;
                }

                console.log('✅ User authenticated:', session.user.email);

                // Look up staff record with role
                const { data: staff, error: staffError } = await supabaseClient
                    .from('staff')
                    .select(`
                        id,
                        auth_user_id,
                        full_name,
                        email,
                        phone,
                        role_id,
                        branch_id,
                        status,
                        sales_code,
                        roles:role_id (
                            id,
                            role_code,
                            role_name,
                            is_active
                        )
                    `)
                    .eq('auth_user_id', session.user.id)
                    .maybeSingle();

                if (staffError) {
                    console.error('❌ Staff lookup error:', staffError);
                    // Check admins table as fallback
                    const { data: admin, error: adminError } = await supabaseClient
                        .from('admins')
                        .select('*')
                        .eq('id', session.user.id)
                        .single();

                    if (admin) {
                        console.log('✅ Found in admins table (legacy)');
                        currentStaff = admin;
                        localStorage.setItem('admin_user', JSON.stringify(admin));
                        updateAdminUI(admin);
                        return true;
                    }

                    window.location.href = 'admin-login.html';
                    return false;
                }

                if (!staff) {
                    console.log('⚠️ No staff record found');
                    window.location.href = 'admin-login.html';
                    return false;
                }

                // Check if Super Admin
                const roleCode = staff.roles?.role_code;
                const roleActive = staff.roles?.is_active === true;
                const staffActive = staff.status === 'ACTIVE';

                const isAdmin = roleCode === 'SUPER_ADMIN' || roleCode === 'ADMIN';

                if (!isAdmin || !roleActive || !staffActive) {
                    console.warn('⚠️ Not authorized:', { roleCode, roleActive, staffActive });
                    await supabaseClient.auth.signOut();
                    window.location.href = 'admin-login.html';
                    return false;
                }

                console.log('✅ Admin verified:', staff.full_name);
                currentStaff = staff;

                localStorage.setItem('admin_user', JSON.stringify(staff));
                localStorage.setItem('admin_session', JSON.stringify(session));

                updateAdminUI(staff);
                return true;

            } catch (error) {
                console.error('❌ Auth check error:', error);
                showToast('error', 'Authentication error');
                return false;
            }
        }

        // ============================================================

        window.exportPaymentsCsv = async function() {
            const btn = document.getElementById('exportPaymentsBtn');
            const statusMsg = document.getElementById('paymentsStatusMsg');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Exporting...';
            statusMsg.className = 'report-status info';
            statusMsg.textContent = 'Fetching payment data...';

            try {
                const from = document.getElementById('paymentsFrom').value;
                const to = document.getElementById('paymentsTo').value;
                const status = document.getElementById('paymentsStatus').value;

                let query = supabaseClient.from('payments').select('*');

                if (from) {
                    query = query.gte('created_at', `${from}T00:00:00`);
                }
                if (to) {
                    query = query.lte('created_at', `${to}T23:59:59`);
                }
                if (status) {
                    query = query.eq('status', status);
                }

                const { data, error } = await query.order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    statusMsg.className = 'report-status warning';
                    statusMsg.textContent = 'No payments found for the selected filters.';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-download"></i> Export Payments CSV';
                    return;
                }

                // Generate CSV
                const headers = ['ID', 'Member Name', 'Membership #', 'Amount', 'Payment Type', 'Status', 'M-Pesa Code', 'Date'];
                const rows = data.map(p => [
                    p.id || '',
                    p.member_name || p.membership_number || '',
                    p.membership_number || '',
                    p.amount || 0,
                    p.payment_type || '',
                    p.status || '',
                    p.mpesa_code || p.mpesa_receipt || '',
                    p.created_at ? new Date(p.created_at).toLocaleString('en-KE') : ''
                ]);

                downloadCSV(headers, rows, `payments_${new Date().toISOString().split('T')[0]}`);

                statusMsg.className = 'report-status success';
                statusMsg.textContent = `✅ ${data.length} payments exported successfully!`;

                showToast('success', `${data.length} payments exported`);

            } catch (error) {
                console.error('Export payments error:', error);
                statusMsg.className = 'report-status error';
                statusMsg.textContent = '❌ Failed to export payments. Please try again.';
                showToast('error', 'Failed to export payments');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-download"></i> Export Payments CSV';
            }
        };

        // ============================================================
        // DOWNLOAD CSV HELPER
        // ============================================================

        function downloadCSV(headers, rows, filename) {
            let csv = headers.join(',') + '\n';

            rows.forEach(row => {
                csv += row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',') + '\n';
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${filename}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ============================================================
        // SIDEBAR TOGGLE
        // ============================================================

        function setupSidebarToggle() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            const toggleBtn = document.getElementById('sidebarToggle');

            if (toggleBtn) {
                toggleBtn.addEventListener('click', function() {
                    sidebar.classList.toggle('open');
                    backdrop.classList.toggle('show');
                });
            }

            if (backdrop) {
                backdrop.addEventListener('click', function() {
                    sidebar.classList.remove('open');
                    backdrop.classList.remove('show');
                });
            }

            document.querySelectorAll('.sidebar-nav a').forEach(function(link) {
                link.addEventListener('click', function() {
                    sidebar.classList.remove('open');
                    backdrop.classList.remove('show');
                });
            });
        }

        // ============================================================

        function updateClock() {
            const clockEl = document.getElementById('currentDateTime');
            if (clockEl) {
                const now = new Date();
                clockEl.textContent = now.toLocaleString('en-KE', {
                    weekday: 'short',
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

            setTimeout(updateClock, 30000);

        // ============================================================
        // TOAST NOTIFICATIONS
        // ============================================================

        function showToast(type, message) {
            const container = document.getElementById('toastContainer');

            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-triangle-exclamation',
                info: 'fa-info-circle'
            };

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas ${icons[type] || icons.info}"></i>
                <span>${message}</span>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100px)';
                toast.style.transition = 'all 0.4s ease';
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        // ============================================================
        // ESCAPE HTML
        // ============================================================

        function escapeHtml(value) {
            if (!value) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
